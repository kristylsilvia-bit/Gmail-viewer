<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --surface: #18181c;
    --surface2: #222228;
    --border: #2e2e38;
    --accent: #e8453c;
    --accent2: #ff6b5b;
    --text: #f0f0f2;
    --text2: #8888a0;
    --text3: #55556a;
    --unread: #ffffff;
    --read: #8888a0;
    --tag-bg: #2a1a1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #pw-gate {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }

  #pw-gate.hidden { display: none; }

  .pw-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    width: 340px;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }

  .pw-logo {
    display: flex; align-items: center; gap: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 15px; font-weight: 500; letter-spacing: 0.04em;
    color: var(--text);
  }

  .pw-logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s infinite;
  }

  .pw-label {
    font-size: 13px; color: var(--text2); text-align: center;
  }

  .pw-input-wrap { position: relative; width: 100%; }

  .pw-input {
    width: 100%; padding: 12px 44px 12px 16px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 15px; letter-spacing: 0.15em;
    outline: none; transition: border-color 0.15s;
  }

  .pw-input:focus { border-color: var(--accent); }
  .pw-input.error { border-color: #e8453c; animation: shake 0.3s; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .pw-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--text3);
    padding: 4px; display: flex; align-items: center;
  }

  .pw-toggle:hover { color: var(--text2); }

  .pw-btn {
    width: 100%; padding: 13px;
    background: var(--accent); border: none; border-radius: 10px;
    color: white; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .pw-btn:hover { background: var(--accent2); }
  .pw-btn:active { transform: scale(0.98); }

  .pw-error {
    font-size: 12px; color: var(--accent); min-height: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--accent); }
    50% { opacity: 0.5; box-shadow: 0 0 3px var(--accent); }
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 14px 6px 8px;
    font-size: 13px;
    color: var(--text2);
  }

  .avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: white;
    text-transform: uppercase;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 28px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1; min-width: 200px; max-width: 420px;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    transition: border-color 0.15s;
  }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box input {
    background: none; border: none; outline: none;
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 13px; width: 100%;
  }
  .search-box input::placeholder { color: var(--text3); }

  .filter-group { display: flex; gap: 6px; }

  .filter-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent); border-color: var(--accent); color: white;
  }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 113px);
  }

  .email-list {
    width: 100%; max-width: 520px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }

  .email-list::-webkit-scrollbar { width: 4px; }
  .email-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .email-item {
    padding: 15px 24px 15px 28px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }
  .email-item:hover { background: var(--surface); }
  .email-item.selected { background: var(--surface2); border-left: 3px solid var(--accent); padding-left: 25px; }
  .email-item.unread .email-sender { color: var(--unread); font-weight: 600; }
  .email-item.unread .email-subject { color: var(--unread); }

  .email-item-top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 3px;
  }

  .email-sender {
    font-size: 14px; color: var(--read);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 72%;
  }

  .email-date {
    font-family: 'DM Mono', monospace; font-size: 11px;
    color: var(--text3); white-space: nowrap; flex-shrink: 0;
  }

  .email-subject {
    font-size: 13px; color: var(--read);
    margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .email-snippet {
    font-size: 12px; color: var(--text3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .unread-dot {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    width: 5px; height: 5px;
    background: var(--accent); border-radius: 50%;
  }

  .email-detail {
    flex: 1; overflow-y: auto;
    padding: 36px 44px;
    display: none;
  }
  .email-detail.visible { display: block; }
  .email-detail::-webkit-scrollbar { width: 4px; }
  .email-detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .detail-subject {
    font-size: 22px; font-weight: 600;
    color: var(--text); margin-bottom: 20px; line-height: 1.3;
  }

  .detail-meta {
    display: flex; flex-direction: column; gap: 7px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 28px;
  }

  .meta-row { display: flex; gap: 10px; font-size: 13px; }
  .meta-label {
    color: var(--text3); font-family: 'DM Mono', monospace;
    font-size: 11px; width: 36px; flex-shrink: 0; padding-top: 1px;
  }
  .meta-value { color: var(--text2); }

  .detail-body {
    font-size: 14px; line-height: 1.8;
    color: var(--text2); white-space: pre-wrap; word-break: break-word;
  }

  .detail-body-iframe {
    width: 100%; border: none;
    background: white; border-radius: 8px;
    display: block; overflow: hidden;
  }

  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 200px; color: var(--text3);
    font-family: 'DM Mono', monospace; font-size: 13px; gap: 10px;
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 300px; gap: 10px;
    color: var(--text3); font-size: 13px; text-align: center;
  }

  .count-badge {
    background: var(--accent); color: white;
    font-size: 10px; font-family: 'DM Mono', monospace;
    padding: 2px 7px; border-radius: 100px; margin-left: 6px;
  }

  .error-banner {
    background: var(--tag-bg);
    border: 1px solid var(--accent);
    color: var(--accent2);
    padding: 12px 20px;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    text-align: center;
  }

  .load-more {
    padding: 14px;
    text-align: center;
    border-top: 1px solid var(--border);
  }

  .btn-load {
    background: none; border: 1px solid var(--border);
    color: var(--text2); padding: 7px 20px;
    border-radius: 8px; font-family: 'DM Mono', monospace;
    font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  .btn-load:hover { border-color: var(--accent); color: var(--accent); }

  /* Mobile */
  @media (max-width: 700px) {
    .email-list { max-width: 100%; border-right: none; }
    .email-detail { padding: 20px; }
    .detail-subject { font-size: 17px; }
    header { padding: 14px 16px; }
    .toolbar { padding: 10px 16px; }
    .main { height: calc(100vh - 105px); }
    .logo span.label { display: none; }
  }

  .back-btn {
    display: none;
    align-items: center; gap: 6px;
    color: var(--text2); font-size: 13px;
    cursor: pointer; padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .back-btn:hover { color: var(--accent); }

  @media (max-width: 700px) {
    .back-btn { display: flex; }
  }
</style>
</head>
<body>

<div id="pw-gate">
  <div class="pw-box">
    <div class="pw-logo">
      <div class="pw-logo-dot"></div>
      mail_viewer
    </div>
    <p class="pw-label">Enter password to continue</p>
    <div class="pw-input-wrap">
      <input id="pw-input" class="pw-input" type="password"
             placeholder="••••••••" autocomplete="off" spellcheck="false" />
      <button class="pw-toggle" id="pw-toggle" tabindex="-1" aria-label="Toggle visibility">
        <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <span class="pw-error" id="pw-error"></span>
    <button class="pw-btn" id="pw-submit">Unlock</button>
  </div>
</div>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <span>MAIL_VIEWER</span>
  </div>
  <div id="user-chip-container"></div>
</header>

<div class="toolbar">
  <div class="search-box">
    <span style="color:var(--text3);font-size:14px">🔍</span>
    <input type="text" placeholder="Search emails..." id="search-input" oninput="filterEmails()">
  </div>
  <div class="filter-group">
    <button class="filter-btn active" onclick="setFilter('all',this)">ALL</button>
    <button class="filter-btn" onclick="setFilter('unread',this)">UNREAD</button>
    <button class="filter-btn" onclick="setFilter('starred',this)">STARRED</button>
  </div>
</div>

<div class="main">
  <div class="email-list" id="email-list">
    <div class="loading"><div class="spinner"></div> Connecting...</div>
  </div>
  <div class="email-detail" id="email-detail">
    <div class="empty-state">← Select an email to read</div>
  </div>
</div>

<script>
function resizeIframe(iframe) {
  function setHeight() {
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      const h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      if (h > 0) iframe.style.height = h + 'px';
      else setTimeout(setHeight, 100);
    } catch(e) {
      iframe.style.height = '800px';
    }
  }
  requestAnimationFrame(setHeight);
}

let allEmails = [];
let nextPageToken = null;
let currentFilter = 'all';
let selectedId = null;
let isMobile = () => window.innerWidth <= 700;

// Load user info and emails on start
window.onload = async () => {
  loadUserInfo();
  loadEmails();
};

async function apiFetch(params) {
  const url = '/api/emails?' + new URLSearchParams(params);
  const res = await fetch(url);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

async function loadUserInfo() {
  try {
    const data = await apiFetch({ action: 'userinfo' });
    const initial = (data.name || data.email || '?')[0].toUpperCase();
    document.getElementById('user-chip-container').innerHTML = `
      <div class="user-chip">
        <div class="avatar">${initial}</div>
        <span style="font-size:13px">${data.email || ''}</span>
      </div>`;
  } catch(e) {}
}

async function loadEmails(append = false) {
  const listEl = document.getElementById('email-list');
  if (!append) {
    listEl.innerHTML = '<div class="loading"><div class="spinner"></div> Loading inbox...</div>';
  } else {
    const btn = document.getElementById('load-more-btn');
    if (btn) btn.textContent = 'Loading...';
  }

  try {
    const params = { maxResults: 50 };
    if (append && nextPageToken) params.pageToken = nextPageToken;

    const data = await apiFetch(params);
    nextPageToken = data.nextPageToken;

    if (!append) {
      allEmails = data.messages || [];
    } else {
      allEmails = [...allEmails, ...(data.messages || [])];
    }

    renderList();
  } catch(e) {
    listEl.innerHTML = `
      <div class="error-banner">⚠ ${e.message}</div>
      <div class="empty-state" style="height:160px">
        <div>Could not load emails.</div>
        <div style="font-size:11px;margin-top:4px">Check Vercel environment variables.</div>
      </div>`;
  }
}

function formatSender(from) {
  const match = from.match(/^"?([^"<]+)"?\s*<?[^>]*>?$/);
  return match ? match[1].trim() : from;
}

function formatDate(dateStr) {
  try {
    const d = new Date(dateStr);
    const now = new Date();
    const diff = now - d;
    if (diff < 86400000 && d.getDate() === now.getDate())
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (diff < 7 * 86400000)
      return d.toLocaleDateString([], { weekday: 'short' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  } catch(e) { return ''; }
}

function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase();
  return allEmails.filter(e => {
    if (currentFilter === 'unread' && !e.unread) return false;
    if (currentFilter === 'starred' && !e.starred) return false;
    if (q) return (
      e.subject.toLowerCase().includes(q) ||
      e.from.toLowerCase().includes(q) ||
      e.snippet.toLowerCase().includes(q)
    );
    return true;
  });
}

function renderList() {
  const listEl = document.getElementById('email-list');
  const emails = getFiltered();
  const unreadCount = allEmails.filter(e => e.unread).length;

  if (emails.length === 0) {
    listEl.innerHTML = '<div class="empty-state">No emails match.</div>';
    return;
  }

  listEl.innerHTML = `
    <div style="padding:10px 24px 6px;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;display:flex;justify-content:space-between;align-items:center;">
      <span>INBOX</span>
      <span>${unreadCount > 0 ? `<span class="count-badge">${unreadCount} unread</span>` : ''}</span>
    </div>
    ${emails.map(e => `
      <div class="email-item ${e.unread ? 'unread' : ''} ${selectedId === e.id ? 'selected' : ''}"
           onclick="openEmail('${e.id}')" id="item-${e.id}">
        ${e.unread ? '<div class="unread-dot"></div>' : ''}
        <div class="email-item-top">
          <div class="email-sender">${esc(formatSender(e.from))}${e.starred ? ' ⭐' : ''}</div>
          <div class="email-date">${formatDate(e.date)}</div>
        </div>
        <div class="email-subject">${esc(e.subject)}</div>
        <div class="email-snippet">${esc(e.snippet)}</div>
      </div>
    `).join('')}
    ${nextPageToken ? `
      <div class="load-more">
        <button class="btn-load" id="load-more-btn" onclick="loadEmails(true)">Load more</button>
      </div>` : ''}
  `;
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function filterEmails() { renderList(); }

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

async function openEmail(id) {
  selectedId = id;
  renderList();

  const detailEl = document.getElementById('email-detail');
  detailEl.classList.add('visible');
  detailEl.innerHTML = `
    ${isMobile() ? '<div class="back-btn" onclick="goBack()">← Back to inbox</div>' : ''}
    <div style="padding:${isMobile() ? '20px' : '0'}">
      <div class="loading"><div class="spinner"></div> Loading...</div>
    </div>`;

  if (isMobile()) {
    document.getElementById('email-list').style.display = 'none';
    detailEl.style.display = 'block';
  }

  try {
    const msg = await apiFetch({ action: 'message', id });

    const headers = msg.payload?.headers || [];
    const get = n => headers.find(h => h.name.toLowerCase() === n.toLowerCase())?.value || '';

    const subject = get('Subject') || '(no subject)';
    const from = get('From');
    const to = get('To');
    const date = new Date(get('Date')).toLocaleString();

    // Extract body
    let bodyHtml = '';
    let bodyText = '';

    function extractParts(part) {
      if (!part) return;
      if (part.mimeType === 'text/html' && part.body?.data && !bodyHtml) {
        bodyHtml = atob(part.body.data.replace(/-/g,'+').replace(/_/g,'/'));
      } else if (part.mimeType === 'text/plain' && part.body?.data && !bodyText) {
        bodyText = atob(part.body.data.replace(/-/g,'+').replace(/_/g,'/'));
      }
      if (part.parts) part.parts.forEach(extractParts);
    }
    extractParts(msg.payload);

    // Mark read visually
    const emailObj = allEmails.find(e => e.id === id);
    if (emailObj) emailObj.unread = false;
    renderList();

    const bodyContent = bodyHtml
      ? `<iframe class="detail-body-iframe" srcdoc="${esc(bodyHtml)}" sandbox="allow-same-origin" scrolling="no" onload="resizeIframe(this)"></iframe>`
      : `<div class="detail-body">${esc(bodyText || msg.snippet || '(no content)')}</div>`;

    detailEl.innerHTML = `
      ${isMobile() ? '<div class="back-btn" onclick="goBack()">← Back to inbox</div>' : ''}
      <div style="padding:${isMobile() ? '20px' : '0'}">
        <div class="detail-subject">${esc(subject)}</div>
        <div class="detail-meta">
          <div class="meta-row">
            <div class="meta-label">FROM</div>
            <div class="meta-value">${esc(from)}</div>
          </div>
          <div class="meta-row">
            <div class="meta-label">TO</div>
            <div class="meta-value">${esc(to)}</div>
          </div>
          <div class="meta-row">
            <div class="meta-label">DATE</div>
            <div class="meta-value">${date}</div>
          </div>
        </div>
        ${bodyContent}
      </div>`;

  } catch(e) {
    detailEl.innerHTML = `
      ${isMobile() ? '<div class="back-btn" onclick="goBack()">← Back to inbox</div>' : ''}
      <div class="empty-state">Failed to load email.<br><small>${e.message}</small></div>`;
  }
}

function goBack() {
  document.getElementById('email-list').style.display = '';
  const d = document.getElementById('email-detail');
  d.style.display = '';
  d.classList.remove('visible');
}

// Password gate
(function() {
  const CORRECT = '12184412184402638';
  const gate = document.getElementById('pw-gate');
  const input = document.getElementById('pw-input');
  const submit = document.getElementById('pw-submit');
  const errorEl = document.getElementById('pw-error');
  const toggle = document.getElementById('pw-toggle');

  function attempt() {
    if (input.value === CORRECT) {
      gate.classList.add('hidden');
    } else {
      errorEl.textContent = 'Incorrect password.';
      input.classList.add('error');
      input.value = '';
      setTimeout(() => { input.classList.remove('error'); errorEl.textContent = ''; }, 1200);
      input.focus();
    }
  }

  submit.addEventListener('click', attempt);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });

  toggle.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    document.getElementById('eye-icon').innerHTML = show
