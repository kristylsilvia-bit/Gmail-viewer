<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090e;
    --surface: #0e1018;
    --surface2: #141722;
    --surface3: #1b2030;
    --border: #1e2438;
    --border2: #283050;
    --accent: #5b8aff;
    --accent2: #7fa5ff;
    --accent-bg: rgba(91, 138, 255, 0.08);
    --accent-glow: rgba(91, 138, 255, 0.22);
    --text: #e2e8f8;
    --text2: #7a90b8;
    --text3: #3d4d6a;
    --unread: #f0f4ff;
    --read: #7a90b8;
    --danger: #f87171;
    --green: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 60px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 16px;
  }
  .logo { display: flex; align-items: center; gap: 11px;
    font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500;
    letter-spacing: 0.05em; user-select: none; flex-shrink: 0; }
  .logo-icon {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent) 0%, #8b6eff 100%);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 0 20px var(--accent-glow);
  }

  .search-wrap { flex: 1; max-width: 560px; position: relative; }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: var(--text3); pointer-events: none; display: flex; }
  .search-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 10px; padding: 9px 14px 9px 38px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: var(--text3); }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

  /* ── ACCOUNT SWITCHER ── */
  .account-wrap { position: relative; flex-shrink: 0; }
  .user-chip {
    display: flex; align-items: center; gap: 9px; background: var(--surface2);
    border: 1px solid var(--border2); border-radius: 100px;
    padding: 4px 12px 4px 4px; font-size: 13px; color: var(--text2);
    cursor: pointer; transition: border-color 0.2s;
  }
  .user-chip:hover { border-color: var(--accent); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    color: white; text-transform: uppercase; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #8b6eff);
  }
  .account-menu {
    position: absolute; right: 0; top: 46px; width: 280px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 14px; padding: 8px; z-index: 200; display: none;
    box-shadow: 0 16px 48px rgba(0,0,0,0.55);
  }
  .account-menu.open { display: block; }
  .acct-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px;
    border-radius: 9px; cursor: pointer; font-size: 13px;
  }
  .acct-row:hover { background: var(--surface3); }
  .acct-row.active { background: var(--accent-bg); }
  .acct-email { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: var(--text); }
  .acct-name { font-size: 11px; color: var(--text3); }
  .acct-x { color: var(--text3); padding: 2px; border-radius: 6px; flex-shrink: 0; }
  .acct-x:hover { color: var(--danger); background: var(--surface); }
  .menu-divider { height: 1px; background: var(--border); margin: 6px 4px; }
  .menu-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px;
    background: none; border: none; color: var(--text2); font-family: inherit;
    font-size: 13px; cursor: pointer; border-radius: 9px; text-align: left;
  }
  .menu-btn:hover { background: var(--surface3); color: var(--text); }

  /* ── LAYOUT ── */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 220px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    padding: 16px 12px; gap: 4px; overflow-y: auto;
  }
  .compose-btn {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    background: linear-gradient(135deg, var(--accent), #8b6eff); color: white;
    border: none; border-radius: 12px; padding: 13px; font-family: inherit;
    font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 12px;
    box-shadow: 0 4px 16px var(--accent-glow); transition: transform 0.1s, box-shadow 0.2s;
  }
  .compose-btn:hover { box-shadow: 0 6px 22px var(--accent-glow); transform: translateY(-1px); }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-radius: 10px; cursor: pointer; color: var(--text2); font-size: 13px;
    transition: background 0.12s, color 0.12s; user-select: none;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent2); font-weight: 600; }
  .nav-item svg { flex-shrink: 0; }
  .nav-item .nav-count { margin-left: auto; font-size: 10px; font-family: 'DM Mono', monospace;
    color: var(--text3); }
  .nav-item.active .nav-count { color: var(--accent2); }

  /* ── EMAIL LIST ── */
  .email-list {
    width: 400px; flex-shrink: 0; border-right: 1px solid var(--border);
    overflow-y: auto; background: var(--surface); display: flex; flex-direction: column;
  }
  .email-list::-webkit-scrollbar, .email-detail::-webkit-scrollbar,
  .sidebar::-webkit-scrollbar { width: 3px; }
  .email-list::-webkit-scrollbar-thumb, .email-detail::-webkit-scrollbar-thumb,
  .sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .list-header {
    padding: 13px 20px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: var(--surface); z-index: 5; flex-shrink: 0;
  }
  .list-title { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.14em; color: var(--text3); text-transform: uppercase; }
  .count-badge { background: var(--accent); color: white; font-size: 10px;
    font-family: 'DM Mono', monospace; padding: 2px 8px; border-radius: 100px; }

  .email-item {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
    border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background 0.1s; position: relative;
  }
  .email-item:hover { background: var(--surface2); }
  .email-item:hover .item-actions { opacity: 1; }
  .email-item.selected { background: var(--surface3); border-left: 2px solid var(--accent); padding-left: 14px; }
  .sender-avatar {
    width: 38px; height: 38px; border-radius: 11px; display: flex;
    align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
    color: white; text-transform: uppercase; flex-shrink: 0; margin-top: 1px;
  }
  .item-body { flex: 1; min-width: 0; }
  .email-item-top { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px; gap: 8px; }
  .email-sender { font-size: 13px; font-weight: 500; color: var(--read);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .email-item.unread .email-sender { color: var(--unread); font-weight: 600; }
  .email-date { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3);
    white-space: nowrap; flex-shrink: 0; }
  .email-item.unread .email-date { color: var(--accent2); }
  .email-subject { font-size: 12px; color: var(--text3); margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .email-item.unread .email-subject { color: var(--text2); font-weight: 500; }
  .email-snippet { font-size: 11px; color: var(--text3); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; opacity: 0.7; }
  .item-actions {
    position: absolute; right: 12px; bottom: 10px; display: flex; gap: 4px;
    opacity: 0; transition: opacity 0.12s; background: var(--surface3);
    border-radius: 8px; padding: 3px;
  }
  .icon-btn {
    background: none; border: none; color: var(--text3); cursor: pointer;
    padding: 5px; border-radius: 6px; display: flex; transition: color 0.12s, background 0.12s;
  }
  .icon-btn:hover { color: var(--accent2); background: var(--surface2); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn.starred { color: #f5b942; }

  /* ── DETAIL ── */
  .email-detail { flex: 1; overflow-y: auto; display: none; background: var(--bg);
    flex-direction: column; }
  .email-detail.visible { display: flex; }
  .detail-toolbar {
    display: flex; align-items: center; gap: 6px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: var(--bg); z-index: 10; flex-shrink: 0;
  }
  .detail-toolbar .tb-btn {
    display: flex; align-items: center; gap: 7px; background: var(--surface2);
    border: 1px solid var(--border2); color: var(--text2); padding: 7px 13px;
    border-radius: 9px; font-family: inherit; font-size: 12px; cursor: pointer;
    transition: all 0.12s;
  }
  .detail-toolbar .tb-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .detail-toolbar .tb-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .detail-toolbar .spacer { flex: 1; }
  .detail-inner { padding: 36px 48px; flex: 1; max-width: 900px; width: 100%; }
  .detail-subject { font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
    color: var(--text); margin-bottom: 22px; line-height: 1.35; }
  .detail-meta { background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 28px; overflow: hidden; }
  .meta-row { display: flex; align-items: baseline; gap: 14px; padding: 11px 20px;
    border-bottom: 1px solid var(--border); }
  .meta-row:last-child { border-bottom: none; }
  .meta-label { color: var(--text3); font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.12em; width: 38px; flex-shrink: 0; text-transform: uppercase; }
  .meta-value { color: var(--text2); font-size: 13px; line-height: 1.5; word-break: break-word; }
  .detail-body { font-size: 14px; line-height: 1.85; color: var(--text2);
    white-space: pre-wrap; word-break: break-word; }
  .detail-body-iframe { width: 100%; border: none; background: white;
    border-radius: 12px; display: block; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }

  /* ── STATES ── */
  .loading { display: flex; align-items: center; justify-content: center; height: 220px;
    color: var(--text3); font-family: 'DM Mono', monospace; font-size: 12px; gap: 10px; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.65s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 300px; gap: 12px; color: var(--text3);
    font-size: 13px; text-align: center; padding: 24px; }
  .empty-icon { width: 52px; height: 52px; border-radius: 16px; background: var(--surface2);
    border: 1px solid var(--border2); display: flex; align-items: center;
    justify-content: center; margin-bottom: 6px; color: var(--text3); }
  .error-banner { background: rgba(248,113,113,0.07); border-bottom: 1px solid rgba(248,113,113,0.18);
    color: var(--danger); padding: 12px 20px; font-size: 12px;
    font-family: 'DM Mono', monospace; text-align: center; }
  .load-more { padding: 16px; text-align: center; border-top: 1px solid var(--border); }
  .btn-load { background: var(--surface2); border: 1px solid var(--border2); color: var(--text2);
    padding: 8px 24px; border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 11px;
    letter-spacing: 0.06em; cursor: pointer; transition: all 0.15s; }
  .btn-load:hover { border-color: var(--accent); color: var(--accent2); background: var(--accent-bg); }

  /* ── AUTH GATE ── */
  .auth-gate { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; text-align: center; padding: 40px; }
  .auth-gate h2 { font-size: 24px; font-weight: 600; }
  .auth-gate p { color: var(--text2); font-size: 14px; max-width: 420px; }
  .google-btn {
    display: flex; align-items: center; gap: 12px; background: white; color: #1f1f1f;
    border: none; border-radius: 12px; padding: 13px 24px; font-family: inherit;
    font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); transition: transform 0.1s;
  }
  .google-btn:hover { transform: translateY(-1px); }

  /* ── COMPOSE MODAL ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: flex-end; justify-content: flex-end; z-index: 500;
    padding: 0 24px 0 0; }
  .modal-overlay.open { display: flex; }
  .compose {
    width: 540px; max-width: 100%; max-height: 88vh; background: var(--surface2);
    border: 1px solid var(--border2); border-radius: 16px 16px 0 0;
    display: flex; flex-direction: column; box-shadow: 0 -8px 48px rgba(0,0,0,0.6);
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .compose-head { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 600; font-family: 'DM Mono', monospace;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--text2); }
  .compose-body { display: flex; flex-direction: column; overflow-y: auto; }
  .compose-field { display: flex; align-items: center; border-bottom: 1px solid var(--border); }
  .compose-field label { font-size: 11px; color: var(--text3); width: 60px; padding-left: 18px;
    font-family: 'DM Mono', monospace; text-transform: uppercase; }
  .compose-field input { flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: inherit; font-size: 13px; padding: 13px 18px 13px 0; }
  .compose-body textarea { flex: 1; min-height: 240px; background: none; border: none;
    outline: none; color: var(--text); font-family: inherit; font-size: 14px;
    line-height: 1.7; padding: 18px; resize: vertical; }
  .compose-foot { display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    border-top: 1px solid var(--border); }
  .send-btn { display: flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--accent), #8b6eff); color: white;
    border: none; border-radius: 10px; padding: 10px 22px; font-family: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer; }
  .send-btn:disabled { opacity: 0.5; cursor: default; }
  .compose-status { font-size: 12px; color: var(--text3); }

  /* ── TOAST ── */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface3); border: 1px solid var(--border2); color: var(--text);
    padding: 12px 22px; border-radius: 12px; font-size: 13px; z-index: 600;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5); opacity: 0; transition: all 0.25s; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .back-btn { display: none; align-items: center; gap: 8px; color: var(--text2);
    font-size: 13px; cursor: pointer; padding: 6px 10px; }
  .back-btn:hover { color: var(--accent2); }

  @media (max-width: 900px) {
    .sidebar { display: none; }
  }
  @media (max-width: 720px) {
    .email-list { width: 100%; border-right: none; }
    .detail-inner { padding: 20px; }
    .detail-subject { font-size: 18px; }
    .compose { width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; }
    .modal-overlay { padding: 0; }
    .back-btn { display: flex; }
    .search-wrap { max-width: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
    </div>
    <span>mail</span>
  </div>
  <div class="search-wrap">
    <span class="search-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </span>
    <input class="search-input" type="text" placeholder="Search all mail…  (press Enter)" id="search-input"
           oninput="onSearchInput()" onkeydown="if(event.key==='Enter')runServerSearch()">
  </div>
  <div class="account-wrap">
    <div id="user-chip-container"></div>
    <div class="account-menu" id="account-menu"></div>
  </div>
</header>

<div class="main">
  <nav class="sidebar" id="sidebar">
    <button class="compose-btn" onclick="openCompose()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
      Compose
    </button>
    <div id="nav-folders"></div>
  </nav>

  <div class="email-list" id="email-list">
    <div class="loading"><div class="spinner"></div> Connecting…</div>
  </div>

  <div class="email-detail" id="email-detail">
    <div class="detail-inner">
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <span>Select an email to read</span>
      </div>
    </div>
  </div>
</div>

<!-- COMPOSE MODAL -->
<div class="modal-overlay" id="compose-overlay">
  <div class="compose">
    <div class="compose-head">
      <span id="compose-title">New message</span>
      <button class="icon-btn" onclick="closeCompose()" title="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="compose-body">
      <div class="compose-field"><label>To</label><input id="c-to" type="text" placeholder="recipient@example.com"></div>
      <div class="compose-field"><label>Cc</label><input id="c-cc" type="text" placeholder="optional"></div>
      <div class="compose-field"><label>Subject</label><input id="c-subject" type="text" placeholder="Subject"></div>
      <textarea id="c-body" placeholder="Write your message…"></textarea>
    </div>
    <div class="compose-foot">
      <button class="send-btn" id="send-btn" onclick="sendEmail()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Send
      </button>
      <span class="compose-status" id="compose-status"></span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const FOLDERS = [
  { id: 'INBOX', label: 'Inbox', icon: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>' },
  { id: 'STARRED', label: 'Starred', icon: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' },
  { id: 'SENT', label: 'Sent', icon: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>' },
  { id: 'DRAFT', label: 'Drafts', icon: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/>' },

const AVATAR_COLORS = [
  ['#5b8aff','#3b6de0'],['#8b5cf6','#6d3fc8'],['#06b6d4','#0891b2'],['#10b981','#059669'],
  ['#f59e0b','#d97706'],['#ef4444','#dc2626'],['#ec4899','#db2777'],['#f97316','#ea580c'],
  ['#14b8a6','#0d9488'],['#a855f7','#9333ea'],
];
function avatarColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

async function init() {

  });

// ── API ──
async function apiGet(params) {
  const res = await fetch('/api/gmail?' + new URLSearchParams(params));
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) { const e = new Error(data.error || res.statusText); e.needAuth = data.needAuth; throw e; }
  return data;
}
async function apiPost(payload) {
  const res = await fetch('/api/gmail', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
  });
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) { const e = new Error(data.error || res.statusText); e.needAuth = data.needAuth; throw e; }
  return data;
}

}

function toggleAccountMenu(e) { e.stopPropagation(); document.getElementById('account-menu').classList.toggle('open'); }

async function switchAccount(email) {
  if (email === activeEmail) { document.getElementById('account-menu').classList.remove('open'); return; }
  await apiPost({ action: 'switch', email });
  activeEmail = email;
  document.getElementById('account-menu').classList.remove('open');
  selectedId = null;
  closeDetail();
  renderAccountChip();
  await loadEmails();
  toast('Switched to ' + email);
}

async function signOut(email) {
  const data = await apiPost({ action: 'signout', email });
  accounts = data.accounts || [];
  if (activeEmail === email) activeEmail = accounts[0]?.email || null;
  renderAccountChip();
  if (!accounts.length) { showAuthGate(); return; }
  await loadEmails();
  toast('Signed out ' + email);
}

function gmailLabelFor(folder) {
  if (folder === 'DRAFT') return 'DRAFT';
  if (folder === 'ALL') return '';
  return folder;
}

// ── LIST ──
async function loadEmails(append = false) {
  const listEl = document.getElementById('email-list');
  if (!append) listEl.innerHTML = '<div class="loading"><div class="spinner"></div> Loading…</div>';
  else { const b = document.getElementById('load-more-btn'); if (b) b.textContent = 'Loading…'; }

  try {
    const params = { maxResults: 40 };
    if (currentQuery) { params.label = 'SEARCH'; params.q = currentQuery; }
    else { const lbl = gmailLabelFor(currentFolder); if (lbl) params.label = lbl; else params.label = 'SEARCH'; }
    if (append && nextPageToken) params.pageToken = nextPageToken;

    const data = await apiGet(params);
    nextPageToken = data.nextPageToken;
    allEmails = append ? [...allEmails, ...(data.messages || [])] : (data.messages || []);
    renderList();
  } catch (e) {
    if (e.needAuth) return showAuthGate();
    listEl.innerHTML = `<div class="error-banner">⚠ ${esc(e.message)}</div>
      <div class="empty-state"><div class="empty-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div><span>Could not load mail.</span></div>`;
  }
}

function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatSender(from) {
  if (!from) return '(unknown)';
  const m = from.match(/^"?([^"<]+)"?\s*<?[^>]*>?$/);
  return m ? m[1].trim() : from;
}
function emailAddress(from) {
  const m = (from || '').match(/<([^>]+)>/);
  return m ? m[1] : (from || '').trim();
}
function formatDate(dateStr) {
  try {
    const d = new Date(dateStr), now = new Date(), diff = now - d;
    if (diff < 86400000 && d.getDate() === now.getDate()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (diff < 7 * 86400000) return d.toLocaleDateString([], { weekday: 'short' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  } catch { return ''; }
}

let currentMessage = null;

async function openEmail(id) {
  selectedId = id;
  renderList();
  const detailEl = document.getElementById('email-detail');
  detailEl.classList.add('visible');
  detailEl.innerHTML = `<div class="detail-inner"><div class="loading"><div class="spinner"></div> Loading…</div></div>`;
  if (isMobile()) { document.getElementById('email-list').style.display = 'none'; detailEl.style.display = 'flex'; }

  try {
    const msg = await apiGet({ action: 'message', id });
    currentMessage = msg;
    const headers = msg.payload?.headers || [];
    const get = n => headers.find(h => h.name.toLowerCase() === n.toLowerCase())?.value || '';
    const subject = get('Subject') || '(no subject)';
    const from = get('From'), to = get('To'), cc = get('Cc');
    const date = (() => { try { return new Date(get('Date')).toLocaleString(); } catch { return get('Date'); } })();

    let bodyHtml = '', bodyText = '';
    (function walk(part) {
      if (!part) return;
      if (part.mimeType === 'text/html' && part.body?.data && !bodyHtml) bodyHtml = b64(part.body.data);
      else if (part.mimeType === 'text/plain' && part.body?.data && !bodyText) bodyText = b64(part.body.data);
      if (part.parts) part.parts.forEach(walk);
    })(msg.payload);

    const emailObj = allEmails.find(e => e.id === id);
    if (emailObj && emailObj.unread) { emailObj.unread = false; markRead(id, false); renderList(); }

    const bodyContent = bodyHtml
      ? `<iframe class="detail-body-iframe" srcdoc="${esc(bodyHtml)}" sandbox="allow-same-origin allow-popups" scrolling="no" onload="resizeIframe(this)"></iframe>`
      : `<div class="detail-body">${esc(bodyText || msg.snippet || '(no content)')}</div>`;

    const starred = (msg.labelIds || []).includes('STARRED');
    const inTrash = (msg.labelIds || []).includes('TRASH');
    const inSpam = (msg.labelIds || []).includes('SPAM');

    detailEl.innerHTML = `
      <div class="detail-toolbar">
        ${isMobile() ? `<div class="back-btn" onclick="goBack()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>` : ''}

        <button class="tb-btn" onclick="toggleStar('${id}', true)"><svg width="14" height="14" viewBox="0 0 24 24" fill="${starred ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${starred ? 'Starred' : 'Star'}</button>
        <button class="tb-btn" onclick="markUnreadAndClose('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> Unread</button>
        ${!inTrash && !inSpam ? `<button class="tb-btn" onclick="archiveEmail('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg> Archive</button>` : ''}
        ${inSpam ? `<button class="tb-btn" onclick="notSpam('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Not spam</button>`
          : (!inTrash ? `<button class="tb-btn" onclick="markSpam('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Spam</button>` : '')}
        <span class="spacer"></span>
        ${inTrash
          ? `<button class="tb-btn" onclick="untrashEmail('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg> Restore</button>
             <button class="tb-btn danger" onclick="deleteEmail('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg> Delete forever</button>`
          : `<button class="tb-btn danger" onclick="trashEmail('${id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Trash</button>`}

    if (e.needAuth) return showAuthGate();
    detailEl.innerHTML = `<div class="detail-inner"><div class="empty-state"><div class="empty-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div><span>Failed to load email.</span><span style="font-size:11px;color:var(--text3)">${esc(e.message)}</span></div></div>`;
  }
}

function b64(data) {
  try { return decodeURIComponent(escape(atob(data.replace(/-/g,'+').replace(/_/g,'/')))); }
  catch { return atob(data.replace(/-/g,'+').replace(/_/g,'/')); }
}

function closeDetail() {
  const d = document.getElementById('email-detail');
  d.classList.remove('visible'); d.style.display = '';
  document.getElementById('email-list').style.display = '';
}
function goBack() {
  document.getElementById('email-list').style.display = '';
  const d = document.getElementById('email-detail');
  d.style.display = ''; d.classList.remove('visible');
}

// ── ACTIONS ──
function markRead(id, removeFromView) {
  apiPost({ action: 'modify', id, removeLabelIds: ['UNREAD'] }).catch(() => {});
}
async function markUnreadAndClose(id) {
  await apiPost({ action: 'modify', id, addLabelIds: ['UNREAD'] });
  const e = allEmails.find(x => x.id === id); if (e) e.unread = true;
  selectedId = null; closeDetail(); renderList(); toast('Marked as unread');
}
async function toggleStar(id, fromDetail) {
  const e = allEmails.find(x => x.id === id);
  const wasStarred = e ? e.starred : (currentMessage?.labelIds || []).includes('STARRED');
  await apiPost({ action: 'modify', id, [wasStarred ? 'removeLabelIds' : 'addLabelIds']: ['STARRED'] });
  if (e) e.starred = !wasStarred;
  if (currentFolder === 'STARRED' && wasStarred) { allEmails = allEmails.filter(x => x.id !== id); if (selectedId === id) { selectedId = null; closeDetail(); } }
  renderList();
  if (fromDetail && selectedId === id) openEmail(id);
}
async function trashEmail(id) {
  await apiPost({ action: 'trash', id });
  removeFromList(id); toast('Moved to Trash');
}
async function untrashEmail(id) {
  await apiPost({ action: 'untrash', id });
  removeFromList(id); toast('Restored');
}
async function deleteEmail(id) {
  if (!confirm('Permanently delete this email? This cannot be undone.')) return;
  await apiPost({ action: 'delete', id });
  removeFromList(id); toast('Deleted forever');
}
async function archiveEmail(id) {
  await apiPost({ action: 'modify', id, removeLabelIds: ['INBOX'] });
  removeFromList(id); toast('Archived');
}
async function markSpam(id) {
  await apiPost({ action: 'modify', id, addLabelIds: ['SPAM'], removeLabelIds: ['INBOX'] });
  removeFromList(id); toast('Marked as spam');
}
async function notSpam(id) {
  await apiPost({ action: 'modify', id, removeLabelIds: ['SPAM'], addLabelIds: ['INBOX'] });
  removeFromList(id); toast('Moved to Inbox');
}
function removeFromList(id) {
  allEmails = allEmails.filter(e => e.id !== id);
  if (selectedId === id) { selectedId = null; closeDetail(); }
  renderList();
}

// ── COMPOSE / SEND ──
function openCompose(reply) {
  composeReply = reply || null;
  document.getElementById('compose-overlay').classList.add('open');
  document.getElementById('compose-status').textContent = '';
  document.getElementById('c-cc').value = '';
  if (reply) {
    document.getElementById('compose-title').textContent = 'Reply';
    document.getElementById('c-to').value = reply.to || '';
    document.getElementById('c-subject').value = reply.subject || '';
    document.getElementById('c-body').value = reply.body || '';
    setTimeout(() => document.getElementById('c-body').focus(), 50);
  } else {
    document.getElementById('compose-title').textContent = 'New message';
    document.getElementById('c-to').value = '';
    document.getElementById('c-subject').value = '';
    document.getElementById('c-body').value = '';
    setTimeout(() => document.getElementById('c-to').focus(), 50);
  }
}
function closeCompose() { document.getElementById('compose-overlay').classList.remove('open'); }

function startReply() {
  if (!currentMessage) return;
  const headers = currentMessage.payload?.headers || [];
  const get = n => headers.find(h => h.name.toLowerCase() === n.toLowerCase())?.value || '';
  const from = get('From');
  let subject = get('Subject') || '';
  if (!/^re:/i.test(subject)) subject = 'Re: ' + subject;
  const msgId = get('Message-ID') || get('Message-Id');
  const refs = get('References');
  const date = get('Date');
  const quoted = `\n\n\nOn ${date}, ${formatSender(from)} wrote:\n> ` +
    (currentMessage.snippet || '').replace(/\n/g, '\n> ');
  openCompose({
    to: emailAddress(from), subject, body: quoted,
    threadId: currentMessage.threadId, inReplyTo: msgId, references: (refs ? refs + ' ' : '') + msgId,
  });
}

async function sendEmail() {
  const to = document.getElementById('c-to').value.trim();
  const cc = document.getElementById('c-cc').value.trim();
  const subject = document.getElementById('c-subject').value.trim();
  const body = document.getElementById('c-body').value;
  if (!to) { document.getElementById('compose-status').textContent = 'Add at least one recipient.'; return; }
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  document.getElementById('compose-status').textContent = 'Sending…';
  try {
    const payload = { action: 'send', to, cc, subject, body };
    if (composeReply) { payload.threadId = composeReply.threadId; payload.inReplyTo = composeReply.inReplyTo; payload.references = composeReply.references; }
    await apiPost(payload);
    closeCompose();
    toast('Message sent');
    if (currentFolder === 'SENT') loadEmails();
  } catch (e) {
    document.getElementById('compose-status').textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

// ── MISC ──
function resizeIframe(iframe) {
  function setHeight() {
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      const h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      if (h > 0) iframe.style.height = h + 'px'; else setTimeout(setHeight, 100);
    } catch { iframe.style.height = '800px'; }
  }
  requestAnimationFrame(setHeight);
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeCompose(); document.getElementById('account-menu').classList.remove('open'); }
});
</script>
