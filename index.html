<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090e;
    --surface: #0e1018;
    --surface2: #141722;
    --surface3: #1b2030;
    --border: #1e2438;
    --border2: #283050;
    --accent: #5b8aff;
    --accent2: #7fa5ff;
    --accent-bg: rgba(91, 138, 255, 0.08);
    --accent-glow: rgba(91, 138, 255, 0.22);
    --text: #e2e8f8;
    --text2: #7a90b8;
    --text3: #3d4d6a;
    --unread: #f0f4ff;
    --read: #7a90b8;
    --danger: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 62px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    flex-shrink: 0;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--accent-glow) 40%, var(--accent-glow) 60%, transparent 100%);
  }

  .logo {
    display: flex; align-items: center; gap: 12px;
    font-family: 'DM Mono', monospace;
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.05em; color: var(--text);
    user-select: none;
  }

  .logo-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent) 0%, #8b6eff 100%);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 20px var(--accent-glow), 0 2px 8px rgba(0,0,0,0.4);
    animation: logo-glow 4s ease-in-out infinite;
  }

  @keyframes logo-glow {
    0%, 100% { box-shadow: 0 0 20px var(--accent-glow), 0 2px 8px rgba(0,0,0,0.4); }
    50% { box-shadow: 0 0 32px rgba(91,138,255,0.38), 0 2px 8px rgba(0,0,0,0.4); }
  }

  .user-chip {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 100px;
    padding: 5px 16px 5px 5px;
    font-size: 13px; color: var(--text2);
    cursor: default;
    transition: border-color 0.2s;
  }
  .user-chip:hover { border-color: var(--accent); }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: white;
    text-transform: uppercase; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #8b6eff);
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 10px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    gap: 14px; flex-wrap: wrap;
    flex-shrink: 0;
  }

  .search-wrap { flex: 1; min-width: 180px; max-width: 380px; position: relative; }

  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text3); pointer-events: none; display: flex; align-items: center;
  }

  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 9px 14px 9px 38px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: var(--text3); }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }

  .filter-group { display: flex; gap: 4px; }

  .filter-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--text3);
    padding: 7px 15px;
    border-radius: 8px;
    font-size: 11px; font-weight: 600;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.07em;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover { color: var(--text2); background: var(--surface2); }
  .filter-btn.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent2);
  }

  /* ── LAYOUT ── */
  .main {
    display: flex; flex: 1;
    overflow: hidden;
    height: calc(100vh - 124px);
  }

  /* ── EMAIL LIST ── */
  .email-list {
    width: 380px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--surface);
    display: flex; flex-direction: column;
  }
  .email-list::-webkit-scrollbar { width: 3px; }
  .email-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .list-header {
    padding: 12px 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--surface);
    z-index: 5;
    flex-shrink: 0;
  }

  .list-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px; font-weight: 500;
    letter-spacing: 0.14em; color: var(--text3);
    text-transform: uppercase;
  }

  .count-badge {
    background: var(--accent);
    color: white;
    font-size: 10px; font-family: 'DM Mono', monospace; font-weight: 500;
    padding: 2px 8px; border-radius: 100px;
    letter-spacing: 0.03em;
  }

  .email-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }
  .email-item:hover { background: var(--surface2); }
  .email-item.selected {
    background: var(--surface3);
    border-left: 2px solid var(--accent);
    padding-left: 14px;
  }
  .email-item.selected::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--accent-bg);
    pointer-events: none;
    border-radius: 0;
  }

  .sender-avatar {
    width: 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: white;
    text-transform: uppercase; flex-shrink: 0; margin-top: 1px;
    letter-spacing: 0;
  }

  .item-body { flex: 1; min-width: 0; }

  .email-item-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px; gap: 8px;
  }

  .email-sender {
    font-size: 13px; font-weight: 500; color: var(--read);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }
  .email-item.unread .email-sender { color: var(--unread); font-weight: 600; }

  .email-date {
    font-family: 'DM Mono', monospace; font-size: 10px;
    color: var(--text3); white-space: nowrap; flex-shrink: 0;
  }
  .email-item.unread .email-date { color: var(--accent2); }

  .email-subject {
    font-size: 12px; color: var(--text3);
    margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .email-item.unread .email-subject { color: var(--text2); font-weight: 500; }

  .email-snippet {
    font-size: 11px; color: var(--text3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0.7;
  }

  .unread-dot {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    flex-shrink: 0;
  }

  /* ── EMAIL DETAIL ── */
  .email-detail {
    flex: 1; overflow-y: auto;
    display: none;
    background: var(--bg);
  }
  .email-detail.visible { display: flex; flex-direction: column; }
  .email-detail::-webkit-scrollbar { width: 3px; }
  .email-detail::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .detail-inner { padding: 44px 52px; flex: 1; max-width: 860px; width: 100%; }

  .detail-subject {
    font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
    color: var(--text); margin-bottom: 24px; line-height: 1.35;
  }

  .detail-meta {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 32px;
    overflow: hidden;
  }

  .meta-row {
    display: flex; align-items: baseline; gap: 14px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
  }
  .meta-row:last-child { border-bottom: none; }

  .meta-label {
    color: var(--text3); font-family: 'DM Mono', monospace;
    font-size: 10px; font-weight: 500; letter-spacing: 0.12em;
    width: 38px; flex-shrink: 0; text-transform: uppercase;
  }
  .meta-value { color: var(--text2); font-size: 13px; line-height: 1.5; }

  .detail-body {
    font-size: 14px; line-height: 1.85;
    color: var(--text2); white-space: pre-wrap; word-break: break-word;
  }

  .detail-body-iframe {
    width: 100%; border: none;
    background: white; border-radius: 12px;
    display: block; overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  /* ── STATES ── */
  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 220px; color: var(--text3);
    font-family: 'DM Mono', monospace; font-size: 12px; gap: 10px;
    letter-spacing: 0.04em;
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 300px; gap: 12px;
    color: var(--text3); font-size: 13px; text-align: center;
    padding: 24px;
  }

  .empty-icon {
    width: 52px; height: 52px; border-radius: 16px;
    background: var(--surface2); border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 6px; color: var(--text3);
  }

  .error-banner {
    background: rgba(248, 113, 113, 0.07);
    border-bottom: 1px solid rgba(248, 113, 113, 0.18);
    color: var(--danger);
    padding: 12px 20px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    text-align: center;
  }

  .load-more {
    padding: 16px;
    text-align: center;
    border-top: 1px solid var(--border);
  }

  .btn-load {
    background: var(--surface2); border: 1px solid var(--border2);
    color: var(--text2); padding: 8px 24px;
    border-radius: 8px; font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-load:hover { border-color: var(--accent); color: var(--accent2); background: var(--accent-bg); }

  /* ── MOBILE ── */
  .back-btn {
    display: none; align-items: center; gap: 8px;
    color: var(--text2); font-size: 13px;
    cursor: pointer; padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
    transition: color 0.15s; flex-shrink: 0;
  }
  .back-btn:hover { color: var(--accent2); }

  @media (max-width: 720px) {
    .email-list { width: 100%; border-right: none; }
    .detail-inner { padding: 20px; }
    .detail-subject { font-size: 18px; }
    header { padding: 0 16px; }
    .toolbar { padding: 8px 14px; }
    .main { height: calc(100vh - 118px); }
    .back-btn { display: flex; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
    </div>
    <span>mail_viewer</span>
  </div>
  <div id="user-chip-container"></div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </span>
    <input class="search-input" type="text" placeholder="Search emails…" id="search-input" oninput="filterEmails()">
  </div>
  <div class="filter-group">
    <button class="filter-btn active" onclick="setFilter('all',this)">ALL</button>
    <button class="filter-btn" onclick="setFilter('unread',this)">UNREAD</button>
    <button class="filter-btn" onclick="setFilter('starred',this)">STARRED</button>
  </div>
</div>

<div class="main">
  <div class="email-list" id="email-list">
    <div class="loading"><div class="spinner"></div> Connecting…</div>
  </div>
  <div class="email-detail" id="email-detail">
    <div class="detail-inner">
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <span>Select an email to read</span>
      </div>
    </div>
  </div>
</div>

<script>
function resizeIframe(iframe) {
  function setHeight() {
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      const h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      if (h > 0) iframe.style.height = h + 'px';
      else setTimeout(setHeight, 100);
    } catch(e) {
      iframe.style.height = '800px';
    }
  }
  requestAnimationFrame(setHeight);
}

// Avatar palette — cycles by sender name hash
const AVATAR_COLORS = [
  ['#5b8aff','#3b6de0'],
  ['#8b5cf6','#6d3fc8'],
  ['#06b6d4','#0891b2'],
  ['#10b981','#059669'],
  ['#f59e0b','#d97706'],
  ['#ef4444','#dc2626'],
  ['#ec4899','#db2777'],
  ['#f97316','#ea580c'],
  ['#14b8a6','#0d9488'],
  ['#a855f7','#9333ea'],
];

function avatarColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

let allEmails = [];
let nextPageToken = null;
let currentFilter = 'all';
let selectedId = null;
let isMobile = () => window.innerWidth <= 720;

window.onload = async () => {
  loadUserInfo();
  loadEmails();
};

async function apiFetch(params) {
  const url = '/api/emails?' + new URLSearchParams(params);
  const res = await fetch(url);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

async function loadUserInfo() {
  try {
    const data = await apiFetch({ action: 'userinfo' });
    const initial = (data.name || data.email || '?')[0].toUpperCase();
    document.getElementById('user-chip-container').innerHTML = `
      <div class="user-chip">
        <div class="avatar">${initial}</div>
        <span>${data.email || ''}</span>
      </div>`;
  } catch(e) {}
}

async function loadEmails(append = false) {
  const listEl = document.getElementById('email-list');
  if (!append) {
    listEl.innerHTML = '<div class="loading"><div class="spinner"></div> Loading inbox…</div>';
  } else {
    const btn = document.getElementById('load-more-btn');
    if (btn) btn.textContent = 'Loading…';
  }

  try {
    const params = { maxResults: 50 };
    if (append && nextPageToken) params.pageToken = nextPageToken;

    const data = await apiFetch(params);
    nextPageToken = data.nextPageToken;

    if (!append) {
      allEmails = data.messages || [];
    } else {
      allEmails = [...allEmails, ...(data.messages || [])];
    }

    renderList();
  } catch(e) {
    listEl.innerHTML = `
      <div class="error-banner">⚠ ${e.message}</div>
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <span>Could not load emails.</span>
        <span style="font-size:11px;color:var(--text3)">Check Vercel environment variables.</span>
      </div>`;
  }
}

function formatSender(from) {
  const match = from.match(/^"?([^"<]+)"?\s*<?[^>]*>?$/);
  return match ? match[1].trim() : from;
}

function formatDate(dateStr) {
  try {
    const d = new Date(dateStr);
    const now = new Date();
    const diff = now - d;
    if (diff < 86400000 && d.getDate() === now.getDate())
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (diff < 7 * 86400000)
      return d.toLocaleDateString([], { weekday: 'short' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  } catch(e) { return ''; }
}

function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase();
  return allEmails.filter(e => {
    if (currentFilter === 'unread' && !e.unread) return false;
    if (currentFilter === 'starred' && !e.starred) return false;
    if (q) return (
      e.subject.toLowerCase().includes(q) ||
      e.from.toLowerCase().includes(q) ||
      e.snippet.toLowerCase().includes(q)
    );
    return true;
  });
}

function renderList() {
  const listEl = document.getElementById('email-list');
  const emails = getFiltered();
  const unreadCount = allEmails.filter(e => e.unread).length;

  if (emails.length === 0) {
    listEl.innerHTML = `
      <div class="list-header">
        <span class="list-title">Inbox</span>
      </div>
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <span>No emails match.</span>
      </div>`;
    return;
  }

  const badge = unreadCount > 0
    ? `<span class="count-badge">${unreadCount}</span>`
    : '';

  listEl.innerHTML = `
    <div class="list-header">
      <span class="list-title">Inbox</span>
      ${badge}
    </div>
    ${emails.map(e => {
      const sender = formatSender(e.from);
      const initial = sender[0]?.toUpperCase() || '?';
      const [bg, bg2] = avatarColor(sender);
      return `
        <div class="email-item ${e.unread ? 'unread' : ''} ${selectedId === e.id ? 'selected' : ''}"
             onclick="openEmail('${e.id}')" id="item-${e.id}">
          <div class="sender-avatar" style="background:linear-gradient(135deg,${bg},${bg2})">${initial}</div>
          <div class="item-body">
            <div class="email-item-top">
              <div class="email-sender">${esc(sender)}${e.starred ? ' ⭐' : ''}</div>
              <div class="email-date">${formatDate(e.date)}</div>
            </div>
            <div class="email-subject">${esc(e.subject)}</div>
            <div class="email-snippet">${esc(e.snippet)}</div>
          </div>
          ${e.unread ? '<div class="unread-dot"></div>' : ''}
        </div>`;
    }).join('')}
    ${nextPageToken ? `
      <div class="load-more">
        <button class="btn-load" id="load-more-btn" onclick="loadEmails(true)">Load more</button>
      </div>` : ''}
  `;
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function filterEmails() { renderList(); }

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

async function openEmail(id) {
  selectedId = id;
  renderList();

  const detailEl = document.getElementById('email-detail');
  detailEl.classList.add('visible');
  detailEl.innerHTML = `
    ${isMobile() ? `<div class="back-btn" onclick="goBack()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back to inbox
    </div>` : ''}
    <div class="detail-inner">
      <div class="loading"><div class="spinner"></div> Loading…</div>
    </div>`;

  if (isMobile()) {
    document.getElementById('email-list').style.display = 'none';
    detailEl.style.display = 'flex';
  }

  try {
    const msg = await apiFetch({ action: 'message', id });

    const headers = msg.payload?.headers || [];
    const get = n => headers.find(h => h.name.toLowerCase() === n.toLowerCase())?.value || '';

    const subject = get('Subject') || '(no subject)';
    const from = get('From');
    const to = get('To');
    const date = new Date(get('Date')).toLocaleString();

    let bodyHtml = '';
    let bodyText = '';

    function extractParts(part) {
      if (!part) return;
      if (part.mimeType === 'text/html' && part.body?.data && !bodyHtml) {
        bodyHtml = atob(part.body.data.replace(/-/g,'+').replace(/_/g,'/'));
      } else if (part.mimeType === 'text/plain' && part.body?.data && !bodyText) {
        bodyText = atob(part.body.data.replace(/-/g,'+').replace(/_/g,'/'));
      }
      if (part.parts) part.parts.forEach(extractParts);
    }
    extractParts(msg.payload);

    const emailObj = allEmails.find(e => e.id === id);
    if (emailObj) emailObj.unread = false;
    renderList();

    const bodyContent = bodyHtml
      ? `<iframe class="detail-body-iframe" srcdoc="${esc(bodyHtml)}" sandbox="allow-same-origin" scrolling="no" onload="resizeIframe(this)"></iframe>`
      : `<div class="detail-body">${esc(bodyText || msg.snippet || '(no content)')}</div>`;

    detailEl.innerHTML = `
      ${isMobile() ? `<div class="back-btn" onclick="goBack()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back to inbox
      </div>` : ''}
      <div class="detail-inner">
        <div class="detail-subject">${esc(subject)}</div>
        <div class="detail-meta">
          <div class="meta-row">
            <span class="meta-label">From</span>
            <span class="meta-value">${esc(from)}</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">To</span>
            <span class="meta-value">${esc(to)}</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Date</span>
            <span class="meta-value">${date}</span>
          </div>
        </div>
        ${bodyContent}
      </div>`;

  } catch(e) {
    detailEl.innerHTML = `
      ${isMobile() ? `<div class="back-btn" onclick="goBack()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back to inbox
      </div>` : ''}
      <div class="detail-inner">
        <div class="empty-state">
          <div class="empty-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <span>Failed to load email.</span>
          <span style="font-size:11px;color:var(--text3)">${e.message}</span>
        </div>
      </div>`;
  }
}

function goBack() {
  document.getElementById('email-list').style.display = '';
  const d = document.getElementById('email-detail');
  d.style.display = '';
  d.classList.remove('visible');
}
</script>
</body>
</html>
