<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="comfortable">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ====== DESIGN TOKENS ====== */
  :root {
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px;
    --header-h: 64px;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-full:999px;
    --aurora: linear-gradient(135deg, #6366F1 0%, #8B5CF6 48%, #D946EF 100%);
    --aurora-soft: linear-gradient(135deg, rgba(99,102,241,.16), rgba(217,70,239,.16));
    --t-fast:150ms; --t-base:200ms; --ease:cubic-bezier(.4,0,.2,1);
    --font:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  /* ---- DARK (default) ---- */
  [data-theme="dark"] {
    --bg:#0A0A0F;
    --bg-grad: radial-gradient(1200px 800px at 12% -8%, rgba(124,92,252,.10), transparent 60%),
               radial-gradient(900px 700px at 100% 0%, rgba(217,70,239,.06), transparent 55%), #0A0A0F;
    --surface:#101018; --surface2:#16161F; --surface3:#1D1D29;
    --glass:rgba(22,22,31,.62);
    --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
    --accent:#7C5CFC; --accent2:#A78BFA; --accent-bg:rgba(124,92,252,.12); --accent-glow:rgba(124,92,252,.45);
    --text:#ECECF4; --text2:#9A9AB0; --text3:#5E5E76; --unread:#FBFBFF; --read:#9A9AB0;
    --danger:#F43F5E; --green:#10B981; --amber:#F59E0B;
    --hover:rgba(255,255,255,.04); --selected:rgba(124,92,252,.12);
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 24px -6px rgba(0,0,0,.55);
    --shadow-3:0 24px 64px -12px rgba(0,0,0,.7); --ring:rgba(139,92,246,.55);
    color-scheme:dark;
  }
  /* ---- LIGHT ---- */
  [data-theme="light"] {
    --bg:#F4F4FA;
    --bg-grad: radial-gradient(1200px 800px at 10% -10%, rgba(124,92,252,.10), transparent 55%),
               radial-gradient(900px 700px at 100% 0%, rgba(217,70,239,.07), transparent 50%), #F4F4FA;
    --surface:#FFFFFF; --surface2:#FAFAFE; --surface3:#F0F0F8;
    --glass:rgba(255,255,255,.7);
    --border:rgba(15,15,40,.08); --border2:rgba(15,15,40,.13);
    --accent:#6D5EF6; --accent2:#6D28D9; --accent-bg:rgba(124,92,252,.10); --accent-glow:rgba(124,92,252,.30);
    --text:#15151F; --text2:#5A5A70; --text3:#9C9CB2; --unread:#0B0B14; --read:#5A5A70;
    --danger:#E11D48; --green:#059669; --amber:#B45309;
    --hover:rgba(15,15,40,.035); --selected:rgba(124,92,252,.10);
    --shadow-1:0 1px 2px rgba(20,20,50,.06); --shadow-2:0 10px 30px -8px rgba(30,20,70,.16);
    --shadow-3:0 28px 70px -14px rgba(30,20,70,.24); --ring:rgba(124,92,252,.45);
    color-scheme:light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-grad); background-attachment: fixed; color: var(--text);
    font-family: var(--font); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--t-base) var(--ease), color var(--t-base) var(--ease);
  }
  button, input, textarea { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--r-sm); }
  ::selection { background: rgba(139,92,246,.3); }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: var(--text3); background-clip: content-box; }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; gap: var(--s-4);
    padding: 0 var(--s-5); height: var(--header-h); background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 11px; user-select: none; flex-shrink: 0; }
  .logo-icon {
    width: 38px; height: 38px; border-radius: var(--r-md); background: var(--aurora);
    display: grid; place-items: center; flex-shrink: 0;
    box-shadow: 0 6px 20px -4px var(--accent-glow);
  }
  .logo span { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }

  .search-wrap { flex: 1; max-width: 560px; position: relative; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text3); pointer-events: none; display: flex; }
  .search-input {
    width: 100%; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--border2); border-radius: var(--r-md); padding: 11px 64px 11px 40px;
    color: var(--text); font-size: 14px; outline: none;
    transition: border-color var(--t-fast), box-shadow var(--t-fast);
  }
  .search-input::placeholder { color: var(--text3); }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--selected); }
  .kbd-hint {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 11px; color: var(--text3);
    border: 1px solid var(--border2); border-radius: 6px; padding: 2px 7px;
    pointer-events: none; background: var(--surface2);
  }

  .header-tools { display: flex; align-items: center; gap: var(--s-2); margin-left: auto; flex-shrink: 0; }
  .ghost-btn {
    width: 40px; height: 40px; border-radius: var(--r-md); display: grid; place-items: center;
    color: var(--text2); border: 1px solid transparent; background: none; cursor: pointer;
    transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
  }
  .ghost-btn:hover { background: var(--hover); color: var(--text); border-color: var(--border); }

  /* ── ACCOUNT SWITCHER ── */
  .account-wrap { position: relative; flex-shrink: 0; }
  .user-chip {
    display: flex; align-items: center; gap: 9px; background: none;
    border: 1px solid var(--border2); border-radius: var(--r-full);
    padding: 4px 12px 4px 4px; font-size: 13px; color: var(--text2);
    cursor: pointer; transition: border-color var(--t-fast); text-decoration: none;
  }
  .user-chip:hover { border-color: var(--accent); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    color: white; text-transform: uppercase; flex-shrink: 0; overflow: hidden;
    background: var(--aurora);
  }
  .account-menu {
    position: absolute; right: 0; top: 50px; width: 300px; max-width: calc(100vw - 24px);
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: var(--r-lg); padding: var(--s-2); z-index: 200; display: none;
    box-shadow: var(--shadow-3);
  }
  .account-menu.open { display: block; }
  .acct-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px;
    border-radius: var(--r-sm); cursor: pointer; font-size: 13px;
    transition: background var(--t-fast);
  }
  .acct-row:hover { background: var(--surface3); }
  .acct-row.active { background: var(--accent-bg); }
  .acct-email { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: var(--text); }
  .acct-name { font-size: 11px; color: var(--text3); }
  .acct-x { color: var(--text3); padding: 2px; border-radius: 6px; flex-shrink: 0; display: flex; }
  .acct-x:hover { color: var(--danger); background: var(--surface); }
  .menu-divider { height: 1px; background: var(--border); margin: 6px 4px; }
  .menu-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px;
    background: none; border: none; color: var(--text2); font-family: inherit;
    font-size: 13px; cursor: pointer; border-radius: var(--r-sm); text-align: left;
    transition: background var(--t-fast), color var(--t-fast);
  }
  .menu-btn:hover { background: var(--surface3); color: var(--text); }
  .prov-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

  /* ── LAYOUT ── */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 248px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    padding: var(--s-4); gap: 2px; overflow: hidden;
    transition: width var(--t-base) var(--ease);
  }
  body.sidebar-collapsed .sidebar { width: 78px; }
  .compose-btn {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    background: var(--aurora); color: white; border: none; border-radius: var(--r-md);
    padding: 13px; font-family: inherit; font-size: 15px; font-weight: 650; cursor: pointer;
    margin-bottom: var(--s-3); white-space: nowrap;
    box-shadow: 0 8px 24px -6px var(--accent-glow);
    transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), filter var(--t-fast);
  }
  .compose-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 30px -6px var(--accent-glow); filter: saturate(1.1); }
  .compose-btn:active { transform: translateY(0); }
  .nav-item {
    display: flex; align-items: center; gap: var(--s-3); padding: 9px var(--s-3);
    border-radius: var(--r-sm); cursor: pointer; color: var(--text2); font-size: 14px; font-weight: 500;
    transition: background var(--t-fast), color var(--t-fast); user-select: none; position: relative; white-space: nowrap;
  }
  .nav-item:hover { background: var(--hover); color: var(--text); }
  .nav-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .nav-item svg { flex-shrink: 0; }
  .nav-item.active { background: var(--aurora-soft); color: var(--text); }
  .nav-item.active::before {
    content: ""; position: absolute; left: -16px; top: 50%; transform: translateY(-50%);
    width: 4px; height: 22px; border-radius: 99px; background: var(--aurora);
  }
  .nav-item.active svg { color: var(--accent2); }
  .nav-item .nav-count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--text3); font-variant-numeric: tabular-nums; flex: none; }
  .nav-item.active .nav-count { color: var(--accent2); }

  .sidebar-spacer { flex: 1; }
  .collapse-btn { color: var(--text3); }
  .sidebar-profile {
    display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2);
    border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface2);
    margin-top: var(--s-2); white-space: nowrap; min-width: 0;
  }
  .sidebar-profile .sp-avatar { width: 38px; height: 38px; flex-shrink: 0; }
  .sidebar-profile .sp-meta { min-width: 0; flex: 1; }
  .sidebar-profile .sp-name { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-profile .sp-email { font-size: 12px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; }

  /* collapsed sidebar */
  body.sidebar-collapsed .compose-btn span,
  body.sidebar-collapsed .nav-item span:not(.nav-count),
  body.sidebar-collapsed .nav-item .nav-count,
  body.sidebar-collapsed .sidebar-profile .sp-meta { display: none; }
  body.sidebar-collapsed .compose-btn { padding: 13px 0; }
  body.sidebar-collapsed .nav-item { justify-content: center; }
  body.sidebar-collapsed .sidebar-profile { justify-content: center; }

  /* ── EMAIL LIST ── */
  .email-list {
    width: 420px; flex-shrink: 0; border-right: 1px solid var(--border);
    overflow-y: auto; background: var(--surface); display: flex; flex-direction: column;
  }
  .list-header {
    padding: var(--s-3) var(--s-5); display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: var(--surface); z-index: 6; flex-shrink: 0; gap: var(--s-3);
  }
  .list-title { font-size: 15px; font-weight: 750; letter-spacing: -.02em; color: var(--text);
    display: flex; align-items: center; gap: var(--s-2); }
  .count-badge { background: var(--aurora); color: white; font-size: 11px; font-weight: 700;
    padding: 1px 9px; border-radius: var(--r-full); }
  .density-seg { display: flex; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
  .density-seg button { padding: 6px 9px; color: var(--text3); display: grid; place-items: center; background: none; border: none; cursor: pointer; transition: all var(--t-fast); }
  .density-seg button.active { background: var(--surface3); color: var(--text); }
  .density-seg button:hover:not(.active) { color: var(--text2); }

  .group-head {
    padding: var(--s-4) var(--s-5) var(--s-2);
    font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text3);
  }

  .email-item {
    display: flex; align-items: flex-start; gap: var(--s-3); padding: 13px var(--s-5) 13px var(--s-4);
    border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background var(--t-fast); position: relative;
  }
  .email-item:hover { background: var(--hover); }
  .email-item:hover .item-actions { opacity: 1; transform: none; }
  .email-item.selected { background: var(--selected); }
  .email-item.selected::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--aurora);
  }
  .email-item.unread::after {
    content: ""; position: absolute; left: 7px; top: 17px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--aurora);
  }
  .sender-avatar {
    width: 40px; height: 40px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
    color: white; text-transform: uppercase; flex-shrink: 0; margin-top: 1px; letter-spacing: -.01em;
  }
  .item-body { flex: 1; min-width: 0; }
  .email-item-top { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 3px; gap: 8px; }
  .email-sender { font-size: 14px; font-weight: 550; color: var(--read);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .email-item.unread .email-sender { color: var(--unread); font-weight: 750; }
  .email-date { font-size: 12px; color: var(--text3); white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .email-item.unread .email-date { color: var(--text2); font-weight: 600; }
  .email-subject { font-size: 13.5px; color: var(--text); margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .email-item.unread .email-subject { font-weight: 650; }
  .email-snippet { font-size: 13px; color: var(--text2); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .item-actions {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%) translateX(6px); display: flex; gap: 2px;
    opacity: 0; transition: opacity var(--t-fast), transform var(--t-fast); background: var(--surface3);
    border: 1px solid var(--border); border-radius: var(--r-sm); padding: 3px; box-shadow: var(--shadow-2);
  }
  .icon-btn {
    background: none; border: none; color: var(--text3); cursor: pointer;
    padding: 6px; border-radius: 6px; display: flex; transition: color var(--t-fast), background var(--t-fast);
  }
  .icon-btn:hover { color: var(--text); background: var(--hover); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn.starred { color: var(--amber); }

  /* compact density */
  [data-density="compact"] .email-item { padding-top: 8px; padding-bottom: 8px; }
  [data-density="compact"] .sender-avatar { width: 30px; height: 30px; font-size: 12px; }
  [data-density="compact"] .email-snippet { display: none; }
  [data-density="compact"] .email-item.unread::after { top: 13px; }

  /* ── DETAIL ── */
  .email-detail { flex: 1; overflow-y: auto; display: flex; background: var(--surface2);
    flex-direction: column; }
  .email-detail.visible { display: flex; }
  .detail-toolbar {
    display: flex; align-items: center; gap: 6px; padding: var(--s-3) var(--s-8);
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: var(--surface2); z-index: 10; flex-shrink: 0; flex-wrap: wrap;
  }
  .detail-toolbar .tb-btn {
    display: flex; align-items: center; gap: 7px; background: none;
    border: 1px solid var(--border); color: var(--text2); padding: 8px 14px;
    border-radius: var(--r-sm); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: all var(--t-fast);
  }
  .detail-toolbar .tb-btn:hover { background: var(--hover); color: var(--text); border-color: var(--border2); }
  .detail-toolbar .tb-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .detail-toolbar .tb-btn.tb-primary {
    background: var(--aurora); color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px -6px var(--accent-glow);
  }
  .detail-toolbar .tb-btn.tb-primary:hover { color: #fff; filter: saturate(1.1) brightness(1.05); transform: translateY(-1px); }
  .detail-toolbar .spacer { flex: 1; }
  .detail-inner { padding: var(--s-6) var(--s-8); flex: 1; max-width: 920px; width: 100%; }
  .detail-subject { font-size: 24px; font-weight: 750; letter-spacing: -.025em;
    color: var(--text); margin-bottom: var(--s-6); line-height: 1.25; }
  .detail-meta { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-6); }
  .detail-meta .sender-avatar { width: 46px; height: 46px; font-size: 17px; }
  .detail-meta .dm-body { min-width: 0; flex: 1; }
  .detail-meta .dm-from { font-size: 15px; font-weight: 700; }
  .detail-meta .dm-line { font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail-meta .dm-date { font-size: 12.5px; color: var(--text3); white-space: nowrap; flex-shrink: 0; }
  .detail-body { font-size: 15px; line-height: 1.8; color: var(--text);
    white-space: pre-wrap; word-break: break-word; max-width: 70ch; }
  .detail-body-iframe { width: 100%; border: none; background: white;
    border-radius: var(--r-md); display: block; box-shadow: var(--shadow-2); }

  /* ── STATES ── */
  .loading { display: flex; align-items: center; justify-content: center; height: 220px;
    color: var(--text3); font-size: 13px; gap: 10px; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.65s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* skeletons */
  .skel-row { display: flex; gap: var(--s-3); padding: 13px var(--s-4); border-bottom: 1px solid var(--border); }
  .skel { background: linear-gradient(90deg, var(--surface3) 25%, var(--surface2) 50%, var(--surface3) 75%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 7px; }
  .skel.circ { border-radius: 50%; width: 40px; height: 40px; flex-shrink: 0; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .empty-state { display: flex; flex-direction: column; align-items: center;
    justify-content: center; flex: 1; min-height: 300px; gap: var(--s-3); color: var(--text2);
    font-size: 14.5px; text-align: center; padding: var(--s-8); }
  .empty-icon { width: 96px; height: 96px; border-radius: var(--r-xl); background: var(--aurora-soft);
    border: 1px solid var(--border); display: grid; place-items: center; margin-bottom: var(--s-3);
    color: var(--accent); position: relative; }
  .empty-icon::after { content:""; position:absolute; inset:-1px; border-radius: var(--r-xl);
    background: var(--aurora); opacity:.12; filter: blur(18px); z-index:-1; }
  .empty-title { font-size: 21px; font-weight: 750; letter-spacing: -.02em; color: var(--text); }
  .empty-hint { display: flex; gap: var(--s-4); justify-content: center; margin-top: var(--s-3); color: var(--text3); font-size: 12.5px; }
  .empty-hint .kbd2 { font-family: var(--mono); border: 1px solid var(--border2); border-radius: 6px; padding: 2px 7px; }
  .error-banner { background: color-mix(in srgb, var(--danger) 9%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--danger) 22%, transparent);
    color: var(--danger); padding: 12px var(--s-5); font-size: 13px; text-align: center; }
  .load-more { padding: var(--s-4); text-align: center; border-top: 1px solid var(--border); }
  .btn-load { background: none; border: 1px solid var(--border2); color: var(--text2);
    padding: 9px 24px; border-radius: var(--r-sm); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all var(--t-fast); }
  .btn-load:hover { border-color: var(--accent); color: var(--accent2); background: var(--accent-bg); }

  /* ── AUTH GATE ── */
  .auth-gate { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: var(--s-5); text-align: center; padding: var(--s-8); }
  .auth-gate h2 { font-size: 26px; font-weight: 750; letter-spacing: -.02em; }
  .auth-gate p { color: var(--text2); font-size: 14.5px; max-width: 440px; line-height: 1.6; }
  .google-btn {
    display: flex; align-items: center; gap: 12px; background: var(--aurora); color: #fff;
    border: none; border-radius: var(--r-md); padding: 14px 26px; font-family: inherit;
    font-size: 15px; font-weight: 650; cursor: pointer; text-decoration: none;
    box-shadow: 0 10px 28px -8px var(--accent-glow); transition: transform var(--t-fast), filter var(--t-fast);
  }
  .google-btn:hover { transform: translateY(-1px); filter: saturate(1.1); }
  .google-btn svg { background: #fff; border-radius: 5px; padding: 1px; }

  /* ── MODALS (COMPOSE / CONNECT) ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(5,5,12,.5);
    display: none; align-items: flex-end; justify-content: flex-end; z-index: 500;
    padding: 0 var(--s-6) var(--s-6) 0; }
  .modal-overlay.open { display: flex; }
  .compose {
    width: 600px; max-width: 100%; max-height: 88vh;
    background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(1.4); backdrop-filter: blur(28px) saturate(1.4);
    border: 1px solid var(--border2); border-radius: var(--r-xl);
    display: flex; flex-direction: column; box-shadow: var(--shadow-3);
    animation: slideUp var(--t-base) var(--ease);
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .compose-head { display: flex; align-items: center; justify-content: space-between;
    padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--border);
    font-size: 15px; font-weight: 700; color: var(--text); }
  .compose-body { display: flex; flex-direction: column; overflow-y: auto; }
  .compose-field { display: flex; align-items: center; border-bottom: 1px solid var(--border); }
  .compose-field label { font-size: 13px; color: var(--text3); width: 64px; padding-left: var(--s-5); flex-shrink: 0; }
  .compose-field input { flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: inherit; font-size: 14px; padding: 13px var(--s-5) 13px 0; }
  .compose-body textarea { flex: 1; min-height: 220px; background: none; border: none;
    outline: none; color: var(--text); font-family: inherit; font-size: 15px;
    line-height: 1.65; padding: var(--s-5); resize: vertical; }
  .compose-foot { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) var(--s-5);
    border-top: 1px solid var(--border); }
  .send-btn { display: flex; align-items: center; gap: 8px;
    background: var(--aurora); color: white; border: none; border-radius: var(--r-md);
    padding: 11px 24px; font-family: inherit; font-size: 14px; font-weight: 650; cursor: pointer;
    box-shadow: 0 6px 18px -6px var(--accent-glow); transition: transform var(--t-fast), filter var(--t-fast); }
  .send-btn:hover:not(:disabled) { transform: translateY(-1px); filter: saturate(1.1); }
  .send-btn:disabled { opacity: 0.5; cursor: default; }
  .compose-status { font-size: 13px; color: var(--text3); }

  /* ── AI ASSIST BAR ── */
  .ai-bar { display: flex; flex-direction: column; gap: 8px; padding: var(--s-3) var(--s-5);
    border-bottom: 1px solid var(--border); background: var(--aurora-soft); }
  .ai-row { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
  .ai-spark { display: grid; place-items: center; width: 26px; height: 26px; border-radius: var(--r-sm);
    background: var(--aurora); color: #fff; flex-shrink: 0; box-shadow: 0 4px 12px -3px var(--accent-glow); }
  .ai-input { flex: 1; min-width: 160px; background: var(--surface); border: 1px solid var(--border2);
    border-radius: var(--r-sm); padding: 9px 12px; font-size: 13.5px; color: var(--text); outline: none;
    transition: border-color var(--t-fast), box-shadow var(--t-fast); }
  .ai-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--selected); }
  .ai-tone { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--r-sm);
    padding: 9px 10px; font-size: 13px; color: var(--text); cursor: pointer; outline: none; }
  .ai-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: var(--r-sm);
    font-size: 13px; font-weight: 650; cursor: pointer; border: 1px solid var(--accent);
    color: var(--accent2); background: var(--accent-bg); white-space: nowrap;
    transition: background var(--t-fast), color var(--t-fast), filter var(--t-fast); }
  .ai-btn:hover { filter: brightness(1.08); }
  .ai-btn.ghost { border-color: var(--border2); color: var(--text2); background: none; }
  .ai-btn.ghost:hover { color: var(--text); background: var(--hover); }
  .ai-btn:disabled { opacity: .55; cursor: default; filter: none; }
  .ai-btn .mini-spin { width: 13px; height: 13px; border: 2px solid currentColor; border-top-color: transparent;
    border-radius: 50%; animation: spin .65s linear infinite; }
  .ai-status { font-size: 12px; color: var(--text2); min-height: 0; }
  .ai-status.err { color: var(--danger); }

  /* ── TOAST ── */
  #toast { position: fixed; bottom: var(--s-6); left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface3); border: 1px solid var(--border2); color: var(--text);
    padding: 12px 22px; border-radius: var(--r-md); font-size: 13.5px; font-weight: 550; z-index: 600;
    box-shadow: var(--shadow-3); opacity: 0; transition: all var(--t-base) var(--ease); }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .back-btn { display: none; align-items: center; gap: 6px; color: var(--text2);
    font-size: 13px; cursor: pointer; padding: 6px 8px; border-radius: var(--r-sm); }
  .back-btn:hover { color: var(--text); background: var(--hover); }
  .menu-toggle { display: none; }

  /* ── RESPONSIVE ── */
  @media (max-width: 1100px) {
    body:not(.sidebar-collapsed) .sidebar { width: 78px; }
    body:not(.sidebar-collapsed) .compose-btn span,
    body:not(.sidebar-collapsed) .nav-item span:not(.nav-count),
    body:not(.sidebar-collapsed) .nav-item .nav-count,
    body:not(.sidebar-collapsed) .sidebar-profile .sp-meta { display: none; }
    body:not(.sidebar-collapsed) .compose-btn { padding: 13px 0; }
    body:not(.sidebar-collapsed) .nav-item { justify-content: center; }
    body:not(.sidebar-collapsed) .sidebar-profile { justify-content: center; }
    .collapse-btn { display: none; }
    .email-list { width: 360px; }
  }
  /* dim backdrop behind the mobile sidebar drawer */
  .nav-scrim { display: none; position: fixed; inset: 0; top: var(--header-h); z-index: 25;
    background: rgba(5,5,12,.5); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity var(--t-base) var(--ease); }
  body.menu-open .nav-scrim { opacity: 1; pointer-events: auto; }

  @media (max-width: 820px) {
    :root { --header-h: calc(58px + env(safe-area-inset-top)); }
    header { padding-top: env(safe-area-inset-top);
      padding-left: max(var(--s-4), env(safe-area-inset-left));
      padding-right: max(var(--s-4), env(safe-area-inset-right)); gap: var(--s-2); }

    /* sidebar → off-canvas drawer */
    .sidebar { position: fixed; left: 0; top: var(--header-h); bottom: 0; z-index: 30;
      width: min(86vw, 320px) !important;
      padding-bottom: max(var(--s-4), env(safe-area-inset-bottom));
      border-right: 1px solid var(--border); border-radius: 0 var(--r-xl) var(--r-xl) 0;
      transform: translateX(-100%); transition: transform var(--t-base) var(--ease); box-shadow: var(--shadow-3); }
    body.menu-open .sidebar { transform: none; }
    body .compose-btn span, body .nav-item span:not(.nav-count), body .nav-item .nav-count,
    body .sidebar-profile .sp-meta { display: revert; }
    body .compose-btn { padding: 14px; }
    body .nav-item { justify-content: flex-start; padding: 12px var(--s-3); }
    body .sidebar-profile { justify-content: flex-start; }
    .collapse-btn { display: none; }
    .nav-scrim { display: block; }
    .menu-toggle { display: grid; }

    /* single-pane list + detail */
    .email-list { width: 100%; border-right: none; padding-bottom: env(safe-area-inset-bottom); }
    .email-detail { position: fixed; inset: 0; top: var(--header-h); z-index: 20; display: none; }
    .email-detail.visible { display: flex; }
    .back-btn { display: flex; }
    .search-wrap { max-width: none; }
    .kbd-hint { display: none; }

    /* list rows: actions inline & always tappable (no hover on touch) */
    .email-item { padding: 14px var(--s-4); align-items: center; }
    .email-item .item-actions { position: static; opacity: 1; transform: none;
      background: none; border: none; box-shadow: none; padding: 0; gap: 2px; align-self: center; flex-shrink: 0; }
    .email-item .icon-btn { padding: 8px; }
    .sender-avatar { width: 42px; height: 42px; }

    /* detail toolbar → one swipeable row */
    .detail-toolbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      gap: var(--s-2); padding: var(--s-3) var(--s-4);
      padding-left: max(var(--s-4), env(safe-area-inset-left));
      padding-right: max(var(--s-4), env(safe-area-inset-right)); }
    .detail-toolbar::-webkit-scrollbar { display: none; }
    .detail-toolbar .tb-btn { flex-shrink: 0; padding: 9px 13px; }
    .detail-toolbar .spacer { display: none; }
    .detail-inner { padding: var(--s-5) var(--s-5) max(var(--s-6), env(safe-area-inset-bottom)); }
    .detail-subject { font-size: 21px; }
    .detail-meta { gap: var(--s-3); }
    .detail-body-iframe { border-radius: var(--r-sm); }

    /* compose / connect → bottom sheet */
    .modal-overlay { padding: 0; align-items: flex-end; }
    .compose { width: 100%; max-width: 100%; max-height: 92dvh;
      border-radius: var(--r-xl) var(--r-xl) 0 0; }
    .compose-foot { padding-bottom: max(var(--s-4), env(safe-area-inset-bottom)); flex-wrap: wrap; }
    .composer-body textarea, .compose-body textarea { min-height: 160px; }

    /* AI bar stacks cleanly */
    .ai-spark { display: none; }
    .ai-input { flex: 1 1 100%; }
    .ai-tone, .ai-btn { flex: 1 1 auto; justify-content: center; }
  }

  /* very small phones */
  @media (max-width: 480px) {
    .logo span { display: none; }
    .logo-icon { width: 34px; height: 34px; }
    header { padding-left: max(var(--s-3), env(safe-area-inset-left));
      padding-right: max(var(--s-3), env(safe-area-inset-right)); }
    .user-chip span { display: none; }
    .user-chip { padding: 4px; }
    .ghost-btn { width: 38px; height: 38px; }
    .list-header { padding: var(--s-3) var(--s-4); }
    .group-head { padding: var(--s-3) var(--s-4) 6px; }
    .email-snippet { -webkit-line-clamp: 1; }
    .detail-subject { font-size: 19px; }
  }

  /* touch devices: never rely on hover to reveal row actions */
  @media (hover: none) {
    .email-item .item-actions { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<header>
  <button class="ghost-btn menu-toggle" id="menu-toggle" aria-label="Open menu" onclick="document.body.classList.toggle('menu-open')">
    <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
    </div>
    <span>Mail</span>
  </div>
  <div class="search-wrap">
    <span class="search-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </span>
    <input class="search-input" type="text" placeholder="Search all mail" id="search-input"
           oninput="onSearchInput()" onkeydown="if(event.key==='Enter')runServerSearch()">
    <span class="kbd-hint">⌘K</span>
  </div>
  <div class="header-tools">
    <button class="ghost-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme" onclick="toggleTheme()">
      <svg class="ic" id="theme-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
    <div class="account-wrap">
      <div id="user-chip-container"></div>
      <div class="account-menu" id="account-menu"></div>
    </div>
  </div>
</header>

<div class="main">
  <nav class="sidebar" id="sidebar">
    <button class="compose-btn" onclick="openCompose()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span>Compose</span>
    </button>
    <div id="nav-folders"></div>
    <div class="sidebar-spacer"></div>
    <button class="nav-item collapse-btn" id="collapse-btn" onclick="toggleSidebar()" title="Collapse sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Collapse</span>
    </button>
    <div class="sidebar-profile" id="sidebar-profile"></div>
  </nav>

  <div class="nav-scrim" onclick="document.body.classList.remove('menu-open')" aria-hidden="true"></div>

  <div class="email-list" id="email-list">
    <div class="loading"><div class="spinner"></div> Connecting…</div>
  </div>

  <div class="email-detail" id="email-detail">
    <div class="empty-state">
      <div class="empty-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-6 9 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/><path d="M3 9l9 6 9-6"/>
        </svg>
      </div>
      <span class="empty-title">Select an email to read</span>
      <span>Pick a conversation from the list to read it here.</span>
      <div class="empty-hint"><span><span class="kbd2">↵</span> open</span><span><span class="kbd2">C</span> compose</span><span><span class="kbd2">⌘K</span> search</span></div>
    </div>
  </div>
</div>

<!-- COMPOSE MODAL -->
<div class="modal-overlay" id="compose-overlay">
  <div class="compose">
    <div class="compose-head">
      <span id="compose-title">New message</span>
      <button class="ghost-btn" style="width:32px;height:32px" onclick="closeCompose()" title="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="compose-body">
      <div class="compose-field"><label>To</label><input id="c-to" type="text" placeholder="recipient@example.com"></div>
      <div class="compose-field"><label>Cc</label><input id="c-cc" type="text" placeholder="optional"></div>
      <div class="compose-field"><label>Subject</label><input id="c-subject" type="text" placeholder="Subject"></div>
      <div class="ai-bar">
        <div class="ai-row">
          <span class="ai-spark" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/><path d="M19 14l.8 2L22 16.8 20 17.6 19 20l-.8-2.4L16 16.8 18.2 16 19 14z"/></svg>
          </span>
          <input id="ai-instruction" class="ai-input" type="text" placeholder="Tell AI what to write… e.g. “decline politely, suggest next week”" onkeydown="if(event.key==='Enter'){event.preventDefault();aiGenerate('compose')}">
          <select id="ai-tone" class="ai-tone" aria-label="Tone">
            <option value="professional">Professional</option>
            <option value="friendly">Friendly</option>
            <option value="concise">Concise</option>
            <option value="warm">Warm</option>
            <option value="formal">Formal</option>
            <option value="persuasive">Persuasive</option>
          </select>
          <button class="ai-btn" id="ai-generate-btn" onclick="aiGenerate('compose')">Generate</button>
          <button class="ai-btn ghost" id="ai-improve-btn" onclick="aiGenerate('improve')" title="Rewrite the current draft">Improve draft</button>
        </div>
        <div class="ai-status" id="ai-status"></div>
      </div>
      <textarea id="c-body" placeholder="Write something brilliant…  — or let AI draft it above ✨"></textarea>
    </div>
    <div class="compose-foot">
      <button class="send-btn" id="send-btn" onclick="sendEmail()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Send
      </button>
      <span class="compose-status" id="compose-status"></span>
    </div>
  </div>
</div>

<!-- CONNECT (IMAP) MODAL -->
<div class="modal-overlay" id="connect-overlay" style="align-items:center;justify-content:center;padding:24px;">
  <div class="compose" style="width:min(460px,calc(100vw - 32px));">
    <div class="compose-head">
      <span id="connect-title">Add account</span>
      <button class="ghost-btn" style="width:32px;height:32px" onclick="closeConnect()" title="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="compose-body" style="padding:20px;gap:14px;">
      <p id="connect-hint" style="font-size:13px;color:var(--text2);line-height:1.6;"></p>
      <div class="compose-field" style="border:1px solid var(--border2);border-radius:var(--r-md);">
        <label>Email</label><input id="x-email" type="email" placeholder="you@example.com" style="padding-right:14px;">
      </div>
      <div class="compose-field" style="border:1px solid var(--border2);border-radius:var(--r-md);">
        <label>Password</label><input id="x-pass" type="password" placeholder="App-specific password" style="padding-right:14px;">
      </div>
      <a id="connect-help" href="#" target="_blank" rel="noopener" style="font-size:12px;color:var(--accent2);text-decoration:none;"></a>
    </div>
    <div class="compose-foot">
      <button class="send-btn" id="connect-btn" onclick="submitConnect()">Connect</button>
      <span class="compose-status" id="connect-status"></span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const FOLDERS = [
  { id: 'INBOX', label: 'Inbox', icon: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>' },
  { id: 'STARRED', label: 'Starred', icon: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' },
  { id: 'SENT', label: 'Sent', icon: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>' },
  { id: 'DRAFT', label: 'Drafts', icon: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/>' },
  { id: 'SPAM', label: 'Spam / Junk', icon: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>' },
  { id: 'TRASH', label: 'Trash', icon: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>' },
  { id: 'ALL', label: 'All Mail', icon: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>' },
];

const AVATAR_COLORS = [
  ['#6366F1','#D946EF'],['#0EA5E9','#6366F1'],['#10B981','#0EA5E9'],['#F59E0B','#F43F5E'],
  ['#EC4899','#8B5CF6'],['#8B5CF6','#6366F1'],['#F43F5E','#F59E0B'],['#14B8A6','#10B981'],
  ['#A855F7','#9333EA'],['#F97316','#EA580C'],
];
function avatarColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

// ── API ──
async function apiGet(params) {
  const res = await fetch('/api/gmail?' + new URLSearchParams(params));
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) { const e = new Error(data.error || res.statusText); e.needAuth = data.needAuth; throw e; }
  return data;
}
async function apiPost(payload) {
  const res = await fetch('/api/gmail', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
  });
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) { const e = new Error(data.error || res.statusText); e.needAuth = data.needAuth; e.needScope = data.needScope; throw e; }
  return data;
}

async function switchAccount(email) {
  if (email === activeEmail) { document.getElementById('account-menu').classList.remove('open'); return; }
  await apiPost({ action: 'switch', email });
  activeEmail = email;
  document.getElementById('account-menu').classList.remove('open');
  selectedId = null;
  closeDetail();
  renderAccountChip();
  renderProfile();
  await loadEmails();
  toast('Switched to ' + email);
}

async function signOut(email) {
  const data = await apiPost({ action: 'signout', email });
  accounts = data.accounts || [];
  if (activeEmail === email) activeEmail = accounts[0]?.email || null;
  renderAccountChip();
  renderProfile();
  if (!accounts.length) { showAuthGate(); return; }
  await loadEmails();
  toast('Signed out ' + email);
}

async function loadEmails(append = false) {
  const listEl = document.getElementById('email-list');
  if (!append) listEl.innerHTML = skeletonHTML();
  else { const b = document.getElementById('load-more-btn'); if (b) b.textContent = 'Loading…'; }

  try {
    const params = { maxResults: 40 };
    if (currentQuery) { params.label = 'SEARCH'; params.q = currentQuery; }
    else { const lbl = gmailLabelFor(currentFolder); if (lbl) params.label = lbl; else params.label = 'SEARCH'; }
    if (append && nextPageToken) params.pageToken = nextPageToken;

    const data = await apiGet(params);
    nextPageToken = data.nextPageToken;
    allEmails = append ? [...allEmails, ...(data.messages || [])] : (data.messages || []);
    renderList();

    if (e.needAuth) return showAuthGate();
    listEl.innerHTML = `<div class="error-banner">⚠ ${esc(e.message)}</div>

  }
}

// Group label for an email's date (relative to now).
function dateGroup(dateStr) {
  try {
    const d = new Date(dateStr), now = new Date();
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diffDays = Math.floor((startToday - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    if (diffDays <= 0) return 'Today';
    if (diffDays === 1) return 'Yesterday';
    if (diffDays < 7) return 'This Week';
    if (diffDays < 30) return 'This Month';
    return 'Earlier';
  } catch { return 'Earlier'; }
}

function renderList() {

    <button id="dens-compact" class="${currentDensity==='compact'?'active':''}" title="Compact" onclick="setDensity('compact')" aria-label="Compact density"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M3 9h18M3 13h18M3 17h18M3 21h18"/></svg></button>
  </div>`;
  const badge = unreadCount > 0 ? `<span class="count-badge">${unreadCount}</span>` : '';
  const header = `<div class="list-header"><span class="list-title">${esc(folderLabel)}${badge}</span>${densityToggle}</div>`;

  if (emails.length === 0) {
    listEl.innerHTML = `${header}

        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-6 9 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/><path d="M3 9l9 6 9-6"/></svg>
      </div><span class="empty-title">Nothing here</span><span>This folder is empty.</span></div>`;
    return;
  }

  const inTrash = currentFolder === 'TRASH';
  const inSpam = currentFolder === 'SPAM';
  const showGroups = !currentQuery && currentFolder !== 'STARRED';

  let lastGroup = null;
  const rows = emails.map(e => {
    const sender = formatSender(e.from);
    const initial = sender[0]?.toUpperCase() || '?';
    const [bg, bg2] = avatarColor(sender);
    let groupHead = '';
    if (showGroups) {
      const g = dateGroup(e.date);
      if (g !== lastGroup) { groupHead = `<div class="group-head">${g}</div>`; lastGroup = g; }
    }
    return `${groupHead}
      <div class="email-item ${e.unread ? 'unread' : ''} ${selectedId === e.id ? 'selected' : ''}"
           onclick="openEmail('${e.id}')" id="item-${e.id}">
        <div class="sender-avatar" style="background:linear-gradient(135deg,${bg},${bg2})">${initial}</div>
        <div class="item-body">
          <div class="email-item-top">
            <div class="email-sender">${esc(sender)}</div>
            <div class="email-date">${formatDate(e.date)}</div>
          </div>
          <div class="email-subject">${esc(e.subject)}</div>
          <div class="email-snippet">${esc(e.snippet)}</div>
        </div>
        <div class="item-actions" onclick="event.stopPropagation()">
          <button class="icon-btn ${e.starred ? 'starred' : ''}" title="Star" onclick="toggleStar('${e.id}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="${e.starred ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </button>
          ${inTrash
            ? `<button class="icon-btn" title="Restore" onclick="untrashEmail('${e.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>
               <button class="icon-btn danger" title="Delete forever" onclick="deleteEmail('${e.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>`
            : `${inSpam ? `<button class="icon-btn" title="Not spam" onclick="notSpam('${e.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>` : ''}
               <button class="icon-btn" title="Archive" onclick="archiveEmail('${e.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg></button>

        </div>
      </div>`;
  }).join('');

  listEl.innerHTML = `${header}${rows}
    ${nextPageToken ? `<div class="load-more"><button class="btn-load" id="load-more-btn" onclick="loadEmails(true)">Load more</button></div>` : ''}`;
}

function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatSender(from) {
  if (!from) return '(unknown)';
  const m = from.match(/^"?([^"<]+)"?\s*<?[^>]*>?$/);
  return m ? m[1].trim() : from;
}
function emailAddress(from) {
  const m = (from || '').match(/<([^>]+)>/);
  return m ? m[1] : (from || '').trim();
}
function formatDate(dateStr) {
  try {
    const d = new Date(dateStr), now = new Date(), diff = now - d;
    if (diff < 86400000 && d.getDate() === now.getDate()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (diff < 7 * 86400000) return d.toLocaleDateString([], { weekday: 'short' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  } catch { return ''; }
}

let currentMessage = null;

async function openEmail(id) {
  selectedId = id;
  renderList();
  const detailEl = document.getElementById('email-detail');
  detailEl.classList.add('visible');
  detailEl.innerHTML = `<div class="detail-inner"><div class="loading"><div class="spinner"></div> Loading…</div></div>`;
  if (isMobile()) { document.getElementById('email-list').style.display = 'none'; detailEl.style.display = 'flex'; }

  try {
    const msg = await apiGet({ action: 'message', id });
    currentMessage = msg;
    const headers = msg.payload?.headers || [];
    const get = n => headers.find(h => h.name.toLowerCase() === n.toLowerCase())?.value || '';
    const subject = get('Subject') || '(no subject)';
    const from = get('From'), to = get('To'), cc = get('Cc');
    const date = (() => { try { return new Date(get('Date')).toLocaleString(); } catch { return get('Date'); } })();

    let bodyHtml = '', bodyText = '';
    (function walk(part) {
      if (!part) return;
      if (part.mimeType === 'text/html' && part.body?.data && !bodyHtml) bodyHtml = b64(part.body.data);
      else if (part.mimeType === 'text/plain' && part.body?.data && !bodyText) bodyText = b64(part.body.data);
      if (part.parts) part.parts.forEach(walk);
    })(msg.payload);

    const emailObj = allEmails.find(e => e.id === id);
    if (emailObj && emailObj.unread) { emailObj.unread = false; markRead(id, false); renderList(); }

    const bodyContent = bodyHtml
      ? `<iframe class="detail-body-iframe" srcdoc="${esc(bodyHtml)}" sandbox="allow-same-origin allow-popups" scrolling="no" onload="resizeIframe(this)"></iframe>`
      : `<div class="detail-body">${esc(bodyText || msg.snippet || '(no content)')}</div>`;

    const starred = (msg.labelIds || []).includes('STARRED');
    const inTrash = (msg.labelIds || []).includes('TRASH');
    const inSpam = (msg.labelIds || []).includes('SPAM');

    const senderName = formatSender(from);
    const [abg, abg2] = avatarColor(senderName);
    const senderInitial = senderName[0]?.toUpperCase() || '?';

    detailEl.innerHTML = `
      <div class="detail-toolbar">
        ${isMobile() ? `<div class="back-btn" onclick="goBack()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Back</div>` : ''}
        <button class="tb-btn tb-primary" onclick="startReply()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg> Reply</button>
        <button class="tb-btn" onclick="toggleStar('${id}', true)"><svg width="15" height="15" viewBox="0 0 24 24" fill="${starred ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${starred ? 'Starred' : 'Star'}</button>
        <button class="tb-btn" onclick="markUnreadAndClose('${id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> Unread</button>
        ${!inTrash && !inSpam ? `<button class="tb-btn" onclick="archiveEmail('${id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg> Archive</button>` : ''}
        ${inSpam ? `<button class="tb-btn" onclick="notSpam('${id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Not spam</button>`
          : (!inTrash ? `<button class="tb-btn" onclick="markSpam('${id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Spam</button>` : '')}
        <span class="spacer"></span>
        ${inTrash
          ? `<button class="tb-btn" onclick="untrashEmail('${id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg> Restore</button>
             <button class="tb-btn danger" onclick="deleteEmail('${id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg> Delete forever</button>`
          : `<button class="tb-btn danger" onclick="trashEmail('${id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Trash</button>`}
      </div>
      <div class="detail-inner">
        <div class="detail-subject">${esc(subject)}</div>
        <div class="detail-meta">
          <div class="sender-avatar" style="background:linear-gradient(135deg,${abg},${abg2})">${senderInitial}</div>
          <div class="dm-body">
            <div class="dm-from">${esc(senderName)}</div>
            <div class="dm-line">${esc(emailAddress(from))}</div>
            <div class="dm-line">to ${esc(to)}${cc ? ', cc ' + esc(cc) : ''}</div>
          </div>
          <div class="dm-date">${esc(date)}</div>
        </div>
        ${bodyContent}
      </div>`;
  } catch (e) {
    if (e.needAuth) return showAuthGate();
    detailEl.innerHTML = `<div class="detail-inner"><div class="empty-state"><div class="empty-icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div><span class="empty-title">Failed to load email</span><span style="font-size:12px;color:var(--text3)">${esc(e.message)}</span></div></div>`;
  }
}

function b64(data) {
  try { return decodeURIComponent(escape(atob(data.replace(/-/g,'+').replace(/_/g,'/')))); }
  catch { return atob(data.replace(/-/g,'+').replace(/_/g,'/')); }
}

const EMPTY_STATE_HTML = `<div class="empty-state">
  <div class="empty-icon">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-6 9 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/><path d="M3 9l9 6 9-6"/>
    </svg>
  </div>
  <span class="empty-title">Select an email to read</span>
  <span>Pick a conversation from the list to read it here.</span>
  <div class="empty-hint"><span><span class="kbd2">↵</span> open</span><span><span class="kbd2">C</span> compose</span><span><span class="kbd2">⌘K</span> search</span></div>
</div>`;

function closeDetail() {
  const d = document.getElementById('email-detail');
  d.classList.remove('visible'); d.style.display = '';
  d.innerHTML = EMPTY_STATE_HTML;
  document.getElementById('email-list').style.display = '';
}
function goBack() {
  document.getElementById('email-list').style.display = '';
  const d = document.getElementById('email-detail');
  d.style.display = ''; d.classList.remove('visible');
}

// ── ACTIONS ──
// Run a mutation; on scope/auth failure, route the user to re-authenticate.
async function mutate(payload) {
  try {
    return await apiPost(payload);
  } catch (e) {
    if (e.needScope || e.needAuth) { promptReauth(e.message); }
    else toast('Error: ' + e.message);
    throw e;
  }
}

function markRead(id, removeFromView) {
  apiPost({ action: 'modify', id, removeLabelIds: ['UNREAD'] }).catch(() => {});
}
async function markUnreadAndClose(id) {
  try { await mutate({ action: 'modify', id, addLabelIds: ['UNREAD'] }); } catch { return; }
  const e = allEmails.find(x => x.id === id); if (e) e.unread = true;
  selectedId = null; closeDetail(); renderList(); toast('Marked as unread');
}
async function toggleStar(id, fromDetail) {
  const e = allEmails.find(x => x.id === id);
  const wasStarred = e ? e.starred : (currentMessage?.labelIds || []).includes('STARRED');
  try { await mutate({ action: 'modify', id, [wasStarred ? 'removeLabelIds' : 'addLabelIds']: ['STARRED'] }); } catch { return; }
  if (e) e.starred = !wasStarred;
  if (currentFolder === 'STARRED' && wasStarred) { allEmails = allEmails.filter(x => x.id !== id); if (selectedId === id) { selectedId = null; closeDetail(); } }
  renderList();
  if (fromDetail && selectedId === id) openEmail(id);
}
async function trashEmail(id) {
  try { await mutate({ action: 'trash', id }); } catch { return; }
  removeFromList(id); toast('Moved to Trash');
}
async function untrashEmail(id) {
  try { await mutate({ action: 'untrash', id }); } catch { return; }
  removeFromList(id); toast('Restored');
}
async function deleteEmail(id) {
  if (!confirm('Permanently delete this email? This cannot be undone.')) return;
  try { await mutate({ action: 'delete', id }); } catch { return; }
  removeFromList(id); toast('Deleted forever');
}
async function archiveEmail(id) {
  try { await mutate({ action: 'modify', id, removeLabelIds: ['INBOX'] }); } catch { return; }
  removeFromList(id); toast('Archived');
}
async function markSpam(id) {
  try { await mutate({ action: 'modify', id, addLabelIds: ['SPAM'], removeLabelIds: ['INBOX'] }); } catch { return; }
  removeFromList(id); toast('Marked as spam');
}
async function notSpam(id) {
  try { await mutate({ action: 'modify', id, removeLabelIds: ['SPAM'], addLabelIds: ['INBOX'] }); } catch { return; }
  removeFromList(id); toast('Moved to Inbox');
}
function removeFromList(id) {
  allEmails = allEmails.filter(e => e.id !== id);
  if (selectedId === id) { selectedId = null; closeDetail(); }
  renderList();
}

// ── COMPOSE / SEND ──
function openCompose(reply) {
  composeReply = reply || null;
  document.getElementById('compose-overlay').classList.add('open');
  document.getElementById('compose-status').textContent = '';
  document.getElementById('c-cc').value = '';
  document.getElementById('ai-instruction').value = '';
  const aiStatus = document.getElementById('ai-status'); aiStatus.textContent = ''; aiStatus.className = 'ai-status';
  document.getElementById('ai-improve-btn').textContent = composeReply ? 'Improve reply' : 'Improve draft';
  if (reply) {
    document.getElementById('compose-title').textContent = 'Reply';
    document.getElementById('c-to').value = reply.to || '';
    document.getElementById('c-subject').value = reply.subject || '';
    document.getElementById('c-body').value = reply.body || '';
    setTimeout(() => document.getElementById('c-body').focus(), 50);
  } else {
    document.getElementById('compose-title').textContent = 'New message';
    document.getElementById('c-to').value = '';
    document.getElementById('c-subject').value = '';
    document.getElementById('c-body').value = '';
    setTimeout(() => document.getElementById('c-to').focus(), 50);
  }
}
function closeCompose() { document.getElementById('compose-overlay').classList.remove('open'); }

// ── CONNECT IMAP ACCOUNTS (iCloud / AOL / Yahoo) ──
const PROVIDERS = {
  gmail: { label: 'Gmail / Google Workspace', hint: 'For Gmail or a school/work Google Workspace account, sign in with your full email and a Google app password (not your normal password). This requires 2-Step Verification to be on, and your admin must allow IMAP and app passwords. If your school blocks these, contact IT.', help: 'https://support.google.com/mail/answer/185833', helpText: 'How to create a Google app password →' },
  icloud: { label: 'iCloud', hint: 'Sign in with your iCloud email and an app-specific password. Your Apple ID password will not work — generate one at appleid.apple.com under Sign-In & Security.', help: 'https://support.apple.com/en-us/102654', helpText: 'How to create an iCloud app-specific password →' },
  aol: { label: 'AOL', hint: 'Sign in with your AOL email and an app password. Generate one in AOL Account Security → Generate app password.', help: 'https://help.aol.com/articles/Create-and-manage-app-password', helpText: 'How to create an AOL app password →' },
  yahoo: { label: 'Yahoo', hint: 'Sign in with your Yahoo email and an app password. Generate one in Yahoo Account Security → Generate app password.', help: 'https://help.yahoo.com/kb/SLN15241.html', helpText: 'How to create a Yahoo app password →' },
};
let connectProvider = null;

function openConnect(provider) {
  connectProvider = provider;
  const p = PROVIDERS[provider];
  document.getElementById('account-menu').classList.remove('open');
  document.getElementById('connect-title').textContent = 'Add ' + p.label;
  document.getElementById('connect-hint').textContent = p.hint;
  const help = document.getElementById('connect-help');
  help.href = p.help; help.textContent = p.helpText;
  document.getElementById('x-email').value = '';
  document.getElementById('x-pass').value = '';
  document.getElementById('connect-status').textContent = '';
  document.getElementById('connect-overlay').classList.add('open');
  setTimeout(() => document.getElementById('x-email').focus(), 50);
}
function closeConnect() { document.getElementById('connect-overlay').classList.remove('open'); }

async function submitConnect() {
  const email = document.getElementById('x-email').value.trim();
  const password = document.getElementById('x-pass').value;
  const statusEl = document.getElementById('connect-status');
  if (!email || !password) { statusEl.textContent = 'Enter email and app password.'; return; }
  const btn = document.getElementById('connect-btn');
  btn.disabled = true; statusEl.textContent = 'Verifying…';
  try {
    const res = await fetch('/api/connect', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service: connectProvider, email, password }),
    });
    const data = await res.json().catch(() => ({ error: res.statusText }));
    if (!res.ok) throw new Error(data.error || res.statusText);
    closeConnect();
    selectedId = null; closeDetail();
    currentFolder = 'INBOX'; currentQuery = '';
    document.getElementById('search-input').value = '';
    renderFolders();
    await loadAccounts();
    await loadEmails();
    toast('Connected ' + email);
  } catch (e) {
    statusEl.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

function startReply() {
  if (!currentMessage) return;
  const headers = currentMessage.payload?.headers || [];
  const get = n => headers.find(h => h.name.toLowerCase() === n.toLowerCase())?.value || '';
  const from = get('From');
  let subject = get('Subject') || '';
  if (!/^re:/i.test(subject)) subject = 'Re: ' + subject;
  const msgId = get('Message-ID') || get('Message-Id');
  const refs = get('References');
  const date = get('Date');
  const quoted = `\n\n\nOn ${date}, ${formatSender(from)} wrote:\n> ` +
    (currentMessage.snippet || '').replace(/\n/g, '\n> ');
  openCompose({
    to: emailAddress(from), subject, body: quoted,
    threadId: currentMessage.threadId, inReplyTo: msgId, references: (refs ? refs + ' ' : '') + msgId,
  });
}

async function sendEmail() {
  const to = document.getElementById('c-to').value.trim();
  const cc = document.getElementById('c-cc').value.trim();
  const subject = document.getElementById('c-subject').value.trim();
  const body = document.getElementById('c-body').value;
  if (!to) { document.getElementById('compose-status').textContent = 'Add at least one recipient.'; return; }
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  document.getElementById('compose-status').textContent = 'Sending…';
  try {
    const payload = { action: 'send', to, cc, subject, body };
    if (composeReply) { payload.threadId = composeReply.threadId; payload.inReplyTo = composeReply.inReplyTo; payload.references = composeReply.references; }
    await apiPost(payload);
    closeCompose();
    toast('Message sent');
    if (currentFolder === 'SENT') loadEmails();
  } catch (e) {
    if (e.needScope || e.needAuth) {
      document.getElementById('compose-status').innerHTML =
        'Read-only access — <a href="/api/auth" style="color:var(--accent2)">sign in with Google</a> to enable sending.';
    } else {
      document.getElementById('compose-status').textContent = 'Error: ' + e.message;
    }
  } finally {
    btn.disabled = false;
  }
}

// ── AI WRITING ASSISTANT (Gemini via /api/ai) ──
async function aiGenerate(mode) {
  const instruction = document.getElementById('ai-instruction').value.trim();
  const tone = document.getElementById('ai-tone').value;
  const draft = document.getElementById('c-body').value;
  const to = document.getElementById('c-to').value.trim();
  const subject = document.getElementById('c-subject').value.trim();
  const statusEl = document.getElementById('ai-status');
  const genBtn = document.getElementById('ai-generate-btn');
  const impBtn = document.getElementById('ai-improve-btn');

  // For replies, the composer is pre-filled with quoted text; treat as reply guidance.
  if (mode === 'compose' && composeReply) mode = 'reply';

  if (mode === 'compose' && !instruction) { statusEl.className = 'ai-status err'; statusEl.textContent = 'Tell the assistant what to write first.'; return; }
  if (mode === 'improve' && !draft.trim()) { statusEl.className = 'ai-status err'; statusEl.textContent = 'Write a draft to improve, or use Generate.'; return; }

  const activeBtn = mode === 'improve' ? impBtn : genBtn;
  const original = activeBtn.innerHTML;
  activeBtn.disabled = true; genBtn.disabled = true; impBtn.disabled = true;
  activeBtn.innerHTML = `<span class="mini-spin"></span> ${mode === 'improve' ? 'Improving…' : 'Writing…'}`;
  statusEl.className = 'ai-status'; statusEl.textContent = 'Gemini is drafting your email…';

  try {
    const res = await fetch('/api/ai', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode, instruction, draft, to, subject, tone }),
    });
    const data = await res.json().catch(() => ({ error: res.statusText }));
    if (!res.ok) throw new Error(data.error || res.statusText);

    const bodyEl = document.getElementById('c-body');
    if (mode === 'improve' || mode === 'reply') {
      // Keep any quoted reply text that follows the user's draft.
      const quoteIdx = draft.search(/\n*On .+ wrote:/);
      const tail = quoteIdx > -1 ? draft.slice(quoteIdx) : '';
      bodyEl.value = data.text + (tail ? '\n' + tail : '');
    } else {
      bodyEl.value = data.text;
    }
    statusEl.className = 'ai-status'; statusEl.textContent = '✨ Drafted with ' + (data.model || 'Gemini') + ' — edit as you like.';
    document.getElementById('ai-instruction').value = '';
    bodyEl.focus();
  } catch (e) {
    statusEl.className = 'ai-status err'; statusEl.textContent = e.message;
  } finally {
    genBtn.disabled = false; impBtn.disabled = false;
    activeBtn.innerHTML = original;
  }
}

// ── MISC ──
function resizeIframe(iframe) {
  function setHeight() {
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      const h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      if (h > 0) iframe.style.height = h + 'px'; else setTimeout(setHeight, 100);
    } catch { iframe.style.height = '800px'; }
  }
  requestAnimationFrame(setHeight);
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeCompose(); closeConnect(); document.getElementById('account-menu').classList.remove('open'); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const s = document.getElementById('search-input'); s.focus(); s.select(); }
  const typing = /input|textarea/i.test(document.activeElement.tagName);
  if (!typing && e.key.toLowerCase() === 'c' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); openCompose(); }
});
